// ════════════════════════════════════════════════════════════════
function renderBacklinks(p) {
  const el = $('#backlinks'); if (!el) return;
  const refs = [];
  for (const b of state.blocks.values()) {
    if (b.deleted_at) continue;
    const matches = (b.content || '').match(/\[\[([^\]]+)\]\]/g);
    if (matches) for (const m of matches) {
      const t = m.slice(2, -2);
      if (t.toLowerCase() === (p.title || '').toLowerCase() && b.page_id !== p.id) refs.push(b);
    }
  }
  if (!refs.length) { el.innerHTML = ''; return; }
  el.innerHTML = '<h4>↩ Linked from ' + refs.length + ' block' + (refs.length === 1 ? '' : 's') + '</h4>';
  for (const b of refs) {
    const src = pageById(b.page_id); if (!src || src.deleted_at) continue;
    const titleEsc = (p.title || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const ctx = (b.content || '').replace(new RegExp('\\[\\[' + titleEsc + '\\]\\]', 'gi'), m => `<mark>${esc(m)}</mark>`);
    const item = document.createElement('div'); item.className = 'bl-item';
    item.innerHTML = `<div class="src">${esc(src.title || 'Untitled')}</div><div class="ctx">${ctx.length > 280 ? ctx.slice(0, 280) + '…' : ctx}</div>`;
    item.addEventListener('click', () => openPage(b.page_id));
    el.appendChild(item);
  }
}

function onSidebarSearch(q) {
  if (!q || q.trim().length < 2) { state.filteredTree = null; renderSidebar(); return; }
  const ql = q.toLowerCase(); const matches = new Set();
  for (const p of state.pages.values()) {
    if (p.deleted_at) continue;
    if ((p.title || '').toLowerCase().includes(ql)) matches.add(p.id);
  }
  for (const b of state.blocks.values()) {
    if (b.deleted_at) continue;
    if ((b.content || '').toLowerCase().includes(ql)) matches.add(b.page_id);
  }
  state.filteredTree = Array.from(matches);
  renderSidebar();
}

function openCommandPalette() {
  const bg = $('#modalBg');
  bg.innerHTML = `<div class="modal cmd-modal">
    <input type="text" id="cmdInput" placeholder="Jump to page or type a command…" autofocus>
    <div class="cmd-results" id="cmdResults"></div>
  </div>`;
  bg.classList.add('open');
  const input = $('#cmdInput'); const results = $('#cmdResults');
  let activeIdx = 0; let currentItems = [];
  function renderResults(q) {
    q = (q || '').toLowerCase();
    const items = [];
    items.push({ kind: 'cmd', label: '+ New page', icon: '＋', onChoose: () => { closeModal(); newPage(); } });
    items.push({ kind: 'cmd', label: '+ New database', icon: '⛁', onChoose: () => { closeModal(); newDatabase(); } });
    items.push({ kind: 'cmd', label: '⤓ Export workspace as JSON', icon: '⤓', onChoose: () => { closeModal(); exportWorkspace(); } });
    items.push({ kind: 'cmd', label: '⤒ Import', icon: '⤒', onChoose: () => { closeModal(); openImport(); } });
    items.push({ kind: 'cmd', label: '🗑 Open trash', icon: '🗑', onChoose: () => { closeModal(); openTrash(); } });
    items.push({ kind: 'cmd', label: '☾ Toggle light/dark', icon: '☾', onChoose: () => { closeModal(); toggleTheme(); } });
    items.push({ kind: 'cmd', label: '⚙ Settings', icon: '⚙', onChoose: () => { closeModal(); openSettings(); } });
    let filtered = q ? items.filter(it => it.label.toLowerCase().includes(q)) : items;
    for (const p of state.pages.values()) {
      if (p.deleted_at) continue;
      if (!q || (p.title || '').toLowerCase().includes(q)) {
        filtered.push({ kind: 'page', label: p.title || 'Untitled', icon: p.is_database ? '⛁' : (p.icon || '📄'), ctx: p.is_database ? 'database' : 'page', onChoose: () => { closeModal(); openPage(p.id); } });
      }
    }
    filtered = filtered.slice(0, 30); currentItems = filtered; activeIdx = 0;
    results.innerHTML = filtered.map((it, i) => `<div class="cmd-item ${i === 0 ? 'active' : ''}" data-i="${i}"><span class="icon">${it.icon}</span><span class="lbl">${esc(it.label)}</span>${it.ctx ? `<span class="ctx">${esc(it.ctx)}</span>` : ''}</div>`).join('');
    results.querySelectorAll('.cmd-item').forEach(el => el.addEventListener('click', () => filtered[Number(el.dataset.i)].onChoose()));
  }
  renderResults('');
  input.addEventListener('input', () => renderResults(input.value));
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (!currentItems.length) return; activeIdx = (activeIdx + 1) % currentItems.length; updActive(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (!currentItems.length) return; activeIdx = (activeIdx - 1 + currentItems.length) % currentItems.length; updActive(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (currentItems[activeIdx]) currentItems[activeIdx].onChoose(); }
    else if (e.key === 'Escape') { e.preventDefault(); closeModal(); }
  });
  function updActive() {
    results.querySelectorAll('.cmd-item').forEach((el, i) => el.classList.toggle('active', i === activeIdx));
    const a = results.querySelector('.cmd-item.active'); if (a) a.scrollIntoView({ block: 'nearest' });
  }
}

function closeModal() { $('#modalBg').classList.remove('open'); $('#modalBg').innerHTML = ''; }
$('#modalBg').addEventListener('click', e => { if (e.target.id === 'modalBg') closeModal(); });

function openTrash() {
  const trash = Array.from(state.pages.values()).filter(p => p.deleted_at && !p.parent_page_id);
  const orphanRows = Array.from(state.pages.values()).filter(p => p.deleted_at && p.parent_page_id && !state.pages.get(p.parent_page_id)?.deleted_at);
  const all = [...trash, ...orphanRows].sort((a, b) => (b.deleted_at || '').localeCompare(a.deleted_at || ''));
  let html = `<div class="modal"><span class="close" onclick="closeModal()">×</span><h3>🗑 Trash</h3>`;
  if (!all.length) html += `<p style="color:var(--cream-muted);font-size:13px">Empty. Deleted pages appear here.</p>`;
  else {
    html += `<div style="max-height:380px;overflow-y:auto">`;
    for (const p of all) {
      html += `<div style="padding:8px 10px;border:1px solid var(--line);border-radius:3px;margin-bottom:6px;display:flex;align-items:center;gap:10px;font-size:13px">
        <span style="font-size:16px">${p.is_database ? '⛁' : (p.icon || '📄')}</span>
        <span style="flex:1">${esc(p.title || 'Untitled')}</span>
        <span style="font-family:var(--mono);font-size:10px;color:var(--cream-muted)">${fmtDate(p.deleted_at)}</span>
        <button class="btn ghost" onclick="restoreTrash('${p.id}')">Restore</button>
        <button class="btn ghost danger" onclick="purgeTrash('${p.id}')">Purge</button>
      </div>`;
    }
    html += `</div><div class="row-btns"><button class="btn ghost danger" onclick="purgeAllTrash()">Purge all</button></div>`;
  }
  html += `</div>`;
  $('#modalBg').innerHTML = html; $('#modalBg').classList.add('open');
}
async function restoreTrash(id) { await restorePage(id); closeModal(); render(); toast('Restored'); }
async function purgeTrash(id) { if (!confirm('Permanently delete? Cannot be undone.')) return; await deletePage(id, true); openTrash(); }
async function purgeAllTrash() {
  if (!confirm('Permanently delete EVERYTHING in trash? Cannot be undone.')) return;
  const trash = Array.from(state.pages.values()).filter(p => p.deleted_at);
  for (const p of trash) { state.pages.delete(p.id); await dbDel('pages', p.id); }
  const orphanBlocks = Array.from(state.blocks.values()).filter(b => !state.pages.has(b.page_id));
  for (const b of orphanBlocks) { state.blocks.delete(b.id); await dbDel('blocks', b.id); }
  closeModal(); render(); toast('Purged');
}

function openSettings() {
  const total = Array.from(state.pages.values()).filter(p => !p.deleted_at).length;
  const trash = Array.from(state.pages.values()).filter(p => p.deleted_at).length;
  const blocks = Array.from(state.blocks.values()).filter(b => !b.deleted_at).length;
  $('#modalBg').innerHTML = `<div class="modal">
    <span class="close" onclick="closeModal()">×</span>
    <h3>Settings</h3>
    <div class="row" style="font-family:var(--mono);font-size:11px;color:var(--cream-muted);letter-spacing:.04em;line-height:1.7">
      <div>◊ ${total} pages · ${blocks} blocks · ${trash} in trash · IndexedDB local · v2.0</div>
    </div>
    <div class="row"><label>Theme</label><button class="btn ghost" onclick="toggleTheme();closeModal()">Toggle light / dark</button></div>
    <div class="row"><label>Wipe everything</label><button class="btn danger" onclick="wipeAll()">Reset workspace</button></div>
    <div class="row" style="margin-top:14px;color:var(--cream-muted);font-size:12px;line-height:1.6">
      fallnote v2.0 · MIT · sovereign single-HTML PWA · part of the AI Native Solutions estate.<br>
      <a href="https://github.com/sjgant80-hub/fallnote" target="_blank">github.com/sjgant80-hub/fallnote</a> · <a href="https://www.ai-nativesolutions.com" target="_blank">ai-nativesolutions.com</a>
    </div>
  </div>`;
  $('#modalBg').classList.add('open');
}
async function wipeAll() {
  if (!confirm('Delete EVERY page and block? Cannot be undone.')) return;
  await db.close();
  await new Promise((resolve, reject) => { const r = indexedDB.deleteDatabase(DB_NAME); r.onsuccess = resolve; r.onerror = reject; });
  location.reload();
}

function openExport() {
  $('#modalBg').innerHTML = `<div class="modal">
    <span class="close" onclick="closeModal()">×</span><h3>Export</h3>
    <div class="row"><label>Whole workspace</label><button class="btn brass" onclick="exportWorkspace()">⤓ Download JSON</button></div>
    <div class="row"><label>Current page</label><button class="btn brass" onclick="exportPageMd(state.currentPageId)" ${state.currentPageId ? '' : 'disabled'}>⤓ Download .md</button></div>
    <div class="row" style="color:var(--cream-muted);font-size:11px;line-height:1.5">JSON = full restorable workspace. Markdown = per-page handoff (loses database structure).</div>
  </div>`;
  $('#modalBg').classList.add('open');
}
function exportWorkspace() {
  const data = { fallnote_version: '2.0', exported_at: now(), pages: Array.from(state.pages.values()), blocks: Array.from(state.blocks.values()), meta: { favourites: state.favourites, recent: state.recent } };
  downloadFile(JSON.stringify(data, null, 2), 'fallnote-workspace-' + Date.now() + '.json', 'application/json');
  toast('Workspace exported'); closeModal();
}
function exportPageMd(pageId) {
  const p = pageById(pageId); if (!p) return;
  const lines = [`# ${p.icon || ''} ${p.title || 'Untitled'}`, ''];
  if (p.is_database) {
    const rows = childrenOf(p.id).filter(r => !r.deleted_at); const props = p.schema.properties;
    lines.push('|' + props.map(pr => ' ' + pr.name + ' ').join('|') + '|');
    lines.push('|' + props.map(() => '---').join('|') + '|');
    for (const r of rows) lines.push('|' + props.map(pr => { const v = pr.key === 'title' ? r.title : r.properties?.[pr.key]; return ' ' + (Array.isArray(v) ? v.join(', ') : (v == null ? '' : String(v))) + ' '; }).join('|') + '|');
  } else {
    const blocks = blocksUnder(p.id, null); let n = 1;
    for (const b of blocks) {
      const c = b.content || '';
      if (b.type === 'h1') lines.push('# ' + c);
      else if (b.type === 'h2') lines.push('## ' + c);
      else if (b.type === 'h3') lines.push('### ' + c);
      else if (b.type === 'bullet') lines.push('- ' + c);
      else if (b.type === 'numbered') { lines.push(n + '. ' + c); n++; continue; }
      else if (b.type === 'todo') lines.push('- [' + (b.checked ? 'x' : ' ') + '] ' + c);
      else if (b.type === 'toggle') lines.push('<details><summary>' + c + '</summary>\n</details>');
      else if (b.type === 'quote') lines.push('> ' + c);
      else if (b.type === 'callout') lines.push('> [!NOTE] ' + c);
      else if (b.type === 'code') lines.push('```\n' + c + '\n```');
      else if (b.type === 'divider') lines.push('---');
      else if (b.type === 'image') lines.push('![image](data:embedded)');
      else if (b.type === 'link-to-page') { const lp = pageById(b.page_link_id); lines.push('[[' + (lp ? lp.title : 'broken') + ']]'); }
      else lines.push(c);
      n = 1; lines.push('');
    }
  }
  downloadFile(lines.join('\n'), (p.title || 'page') + '.md', 'text/markdown');
  toast('Markdown downloaded');
}

async function importMarkdown(files) {
  let n = 0;
  for (const f of files) {
    const txt = await f.text(); const lines = txt.split(/\r?\n/);
    const title = (lines[0].replace(/^#+\s*/, '').trim()) || f.name.replace(/\.md$/, '');
    const p = makePage({ title }); await savePage(p);
    let pos = 0;
    for (let i = 1; i < lines.length; i++) {
      const line = lines[i];
      let type = 'paragraph'; let content = line; let checked = false;
      if (/^#\s+/.test(line)) { type = 'h1'; content = line.replace(/^#\s+/, ''); }
      else if (/^##\s+/.test(line)) { type = 'h2'; content = line.replace(/^##\s+/, ''); }
      else if (/^###\s+/.test(line)) { type = 'h3'; content = line.replace(/^###\s+/, ''); }
      else if (/^-\s+\[[ x]\]\s+/.test(line)) { type = 'todo'; checked = /\[x\]/.test(line); content = line.replace(/^-\s+\[[ x]\]\s+/, ''); }
      else if (/^-\s+/.test(line)) { type = 'bullet'; content = line.replace(/^-\s+/, ''); }
      else if (/^\d+\.\s+/.test(line)) { type = 'numbered'; content = line.replace(/^\d+\.\s+/, ''); }
      else if (/^>\s+/.test(line)) { type = 'quote'; content = line.replace(/^>\s+/, ''); }
      else if (/^---+$/.test(line)) { type = 'divider'; content = ''; }
      else if (/^```/.test(line)) {
        let codeLines = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) { codeLines.push(lines[i]); i++; }
        type = 'code'; content = codeLines.join('\n');
      }
      if (line.trim() === '' && type === 'paragraph') continue;
      await saveBlock(makeBlock({ page_id: p.id, type, content, checked, position: pos++ }));
    }
    n++;
  }
  toast(n + ' page' + (n === 1 ? '' : 's') + ' imported'); closeModal(); render();
}

async function importWorkspace(file) {
  if (!file) return;
  const txt = await file.text(); let data;
  try { data = JSON.parse(txt); } catch (e) { toast('Invalid JSON', true); return; }
  if (data.fallnote_version) {
    for (const p of data.pages || []) { state.pages.set(p.id, p); await dbPut('pages', p); }
    for (const b of data.blocks || []) { state.blocks.set(b.id, b); await dbPut('blocks', b); }
    if (data.meta?.favourites) { state.favourites = data.meta.favourites; await dbPut('meta', { key: 'favourites', value: state.favourites }); }
    toast((data.pages?.length || 0) + ' pages, ' + (data.blocks?.length || 0) + ' blocks imported');
  } else toast('Unknown format', true);
  closeModal(); render();
}

function downloadFile(content, filename, mime) {
  const blob = new Blob([content], { type: mime }); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); openCommandPalette(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'p' && !e.shiftKey) { e.preventDefault(); openCommandPalette(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); toast('auto-saved'); }
});

(async () => {
  try {
    await openDB(); await loadAll();
    const meta = await dbGet('meta', 'currentPageId');
    if (meta && state.pages.has(meta.value) && !state.pages.get(meta.value).deleted_at) state.currentPageId = meta.value;
    await seedWelcomeIfEmpty();
    if (!state.currentPageId) { const first = childrenOf(null)[0]; if (first) state.currentPageId = first.id; }
    if (state.currentPageId) {
      let p = pageById(state.currentPageId);
      while (p && p.parent_page_id) { state.treeExpanded.add(p.parent_page_id); p = pageById(p.parent_page_id); }
    }
    render();
  } catch (e) {
    console.error('boot failed', e);
    document.body.innerHTML = '<div style="padding:40px;color:#e6e1d6;background:#0b0a0f;min-height:100vh;font-family:Inter,sans-serif"><h1 style="color:#b8974a">fallnote could not start</h1><p>' + esc(e.message) + '</p><p>Try: Ctrl+Shift+Delete to clear site data, then reload.</p></div>';
  }
})();
