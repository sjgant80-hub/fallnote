<style>
:root {
  --void:#0b0a0f; --void-2:#13121a; --ink:#1a1922; --ink-hover:#22212c;
  --line:#2a2934; --line-soft:#1f1e28;
  --cream:#e6e1d6; --cream-dim:#a8a395; --cream-muted:#6e6a5e;
  --brass:#b8974a; --amber:#ff8c00; --ox:#8b1a1a;
  --green:#4ade80; --red:#ef4444; --blue:#60a5fa; --yellow:#fbbf24; --violet:#a855f7; --pink:#ec4899; --teal:#14b8a6;
  --serif: Georgia, 'Libre Baskerville', ui-serif, serif;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, monospace;
  --sidebar-w: 260px;
}
html.light {
  --void:#fefdf7; --void-2:#f7f4e9; --ink:#eee9d8; --ink-hover:#e4ddc6;
  --line:#d8cfb2; --line-soft:#e6dfc6;
  --cream:#1a1815; --cream-dim:#42403a; --cream-muted:#7a766c;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--void); color: var(--cream); font: 14.5px/1.6 var(--sans);
  min-height: 100dvh; -webkit-font-smoothing: antialiased; overflow: hidden;
}
button { font-family: inherit; cursor: pointer; background: transparent; border: none; color: inherit; }
input, textarea, select {
  font-family: inherit; background: var(--ink); border: 1px solid var(--line);
  color: var(--cream); border-radius: 3px; padding: 7px 10px; outline: none; font-size: 13px;
}
input:focus, textarea:focus, select:focus { border-color: var(--brass); }
a { color: var(--brass); text-decoration: none; }
a:hover { text-decoration: underline; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--brass); }

/* ─── App layout ─── */
.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100dvh; }
.app.no-sidebar { grid-template-columns: 0 1fr; }

/* ─── Sidebar ─── */
aside.sidebar {
  background: var(--void-2); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; overflow: hidden;
}
aside.sidebar .brand {
  display: flex; align-items: center; gap: 10px; padding: 12px 18px;
  border-bottom: 1px solid var(--line); user-select: none;
}
aside.sidebar .brand .mark {
  width: 28px; height: 28px; background: linear-gradient(135deg, var(--brass), var(--amber));
  border-radius: 5px; display: grid; place-items: center;
  font-family: var(--serif); font-weight: 700; font-size: 16px; color: var(--void);
}
aside.sidebar .brand .name { font-family: var(--serif); font-weight: 700; font-size: 15px; }
aside.sidebar .brand .v { margin-left: auto; font-family: var(--mono); font-size: 9px; color: var(--cream-muted); letter-spacing: .12em; text-transform: uppercase; }
aside.sidebar .actions {
  padding: 8px 10px; display: flex; gap: 5px; flex-wrap: wrap;
  border-bottom: 1px solid var(--line-soft);
}
aside.sidebar .actions button {
  padding: 6px 9px; background: var(--ink); border: 1px solid var(--line);
  border-radius: 3px; font-size: 11px; color: var(--cream-dim); flex: 1; min-width: 0;
}
aside.sidebar .actions button:hover { background: var(--ink-hover); color: var(--cream); border-color: var(--brass); }
aside.sidebar .search-wrap { padding: 8px 10px; border-bottom: 1px solid var(--line-soft); }
aside.sidebar .search-wrap input { width: 100%; font-size: 12px; padding: 6px 9px; }
aside.sidebar .nav-section {
  padding: 6px 14px; font-family: var(--mono); font-size: 9px; color: var(--cream-muted);
  letter-spacing: .12em; text-transform: uppercase; margin-top: 8px;
}
aside.sidebar nav.tree {
  flex: 1; overflow-y: auto; padding: 0 6px 24px;
}
aside.sidebar nav.tree .empty {
  padding: 18px 14px; color: var(--cream-muted); font-size: 12px; text-align: center;
}
.tree-node {
  display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 3px;
  cursor: pointer; font-size: 13px; color: var(--cream-dim); user-select: none;
  white-space: nowrap; overflow: hidden;
}
.tree-node:hover { background: var(--ink); color: var(--cream); }
.tree-node.active { background: rgba(184,151,74,.14); color: var(--brass); }
.tree-node .twirl {
  width: 14px; height: 14px; display: grid; place-items: center; flex-shrink: 0;
  font-size: 9px; color: var(--cream-muted); transition: transform .14s;
}
.tree-node .twirl.empty { visibility: hidden; }
.tree-node .twirl.open { transform: rotate(90deg); }
.tree-node .icon { flex-shrink: 0; font-size: 13px; }
.tree-node .title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.tree-node .row-add, .tree-node .row-star {
  opacity: 0; flex-shrink: 0; padding: 2px 5px; font-size: 13px; color: var(--cream-muted);
  border-radius: 2px;
}
.tree-node:hover .row-add, .tree-node:hover .row-star { opacity: 1; }
.tree-node .row-star.starred { opacity: 1; color: var(--brass); }
.tree-node .row-add:hover { background: var(--brass); color: var(--void); }
.tree-node .row-star:hover { color: var(--brass); }
.tree-children { padding-left: 14px; }

aside.sidebar footer {
  padding: 8px 10px; border-top: 1px solid var(--line-soft); display: flex; gap: 4px;
  font-family: var(--mono); font-size: 10px; color: var(--cream-muted); letter-spacing: .04em;
}
aside.sidebar footer button { padding: 5px 7px; border-radius: 2px; flex-shrink: 0; }
aside.sidebar footer button:hover { background: var(--ink); color: var(--brass); }

/* ─── Main content ─── */
main.content { overflow-y: auto; padding: 0 0 200px; position: relative; }
main.content .page-wrap { max-width: 880px; margin: 0 auto; padding: 0 clamp(20px, 6vw, 100px); }
main.content .empty-page {
  max-width: 720px; margin: 80px auto; text-align: center; color: var(--cream-muted);
}
main.content .empty-page h2 { font-family: var(--serif); font-size: 22px; color: var(--brass); margin-bottom: 8px; }
main.content .empty-page p { font-size: 14px; line-height: 1.6; margin-bottom: 16px; }
main.content .empty-page button {
  padding: 9px 16px; background: var(--brass); color: var(--void); font-weight: 600;
  font-size: 13px; border-radius: 3px;
}
main.content .empty-page button:hover { background: var(--amber); }

/* Page cover */
.page-cover {
  height: 180px; background-size: cover; background-position: center; position: relative; cursor: pointer;
  background-color: var(--ink);
}
.page-cover.empty { height: 24px; background: linear-gradient(180deg, var(--void-2), var(--void)); cursor: default; }
.page-cover .cover-actions { position: absolute; right: 16px; bottom: 12px; display: none; gap: 6px; }
.page-cover:hover .cover-actions { display: flex; }
.page-cover .cover-actions button { padding: 5px 11px; font-size: 11px; background: rgba(0,0,0,.55); color: var(--cream); border-radius: 3px; backdrop-filter: blur(4px); }
.add-cover-btn { display: inline-block; font-size: 12px; color: var(--cream-muted); padding: 6px 0; cursor: pointer; }
.add-cover-btn:hover { color: var(--brass); }

.page-header { padding: 22px 0 18px; }
.page-meta {
  display: flex; align-items: center; gap: 12px; padding: 6px 0;
  font-family: var(--mono); font-size: 11px; color: var(--cream-muted); letter-spacing: .04em;
  flex-wrap: wrap;
}
.page-meta .crumb a { color: var(--cream-muted); }
.page-meta .crumb a:hover { color: var(--brass); }
.page-meta .crumb .sep { margin: 0 4px; color: var(--line); }
.page-meta .action-btn {
  padding: 3px 9px; border: 1px solid var(--line); border-radius: 3px;
  background: var(--ink); color: var(--cream-dim); font-size: 10px;
}
.page-meta .action-btn:hover { border-color: var(--brass); color: var(--brass); }
.page-meta .action-btn.danger:hover { border-color: var(--red); color: var(--red); }
.page-icon-row { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; margin-top: 8px; }
.page-icon { font-size: 42px; line-height: 1; padding: 4px 8px; border-radius: 4px; cursor: pointer; user-select: none; }
.page-icon:hover { background: var(--ink); }
.page-title {
  font-family: var(--serif); font-weight: 700; font-size: 38px; line-height: 1.15;
  color: var(--cream); background: transparent; border: none; outline: none;
  width: 100%; padding: 4px 0; letter-spacing: -.01em;
}
.page-title:empty:before { content: attr(data-placeholder); color: var(--cream-muted); }

/* ─── Blocks ─── */
.block-list { padding: 4px 0; }
.block {
  position: relative; padding: 2px 0 2px 32px; min-height: 28px;
  display: flex; align-items: flex-start; gap: 4px;
}
.block.drag-over-top { box-shadow: 0 -2px 0 0 var(--brass) inset; }
.block.drag-over-bot { box-shadow: 0 -2px 0 0 var(--brass); }
.block.is-dragging { opacity: .35; }
.block:hover .block-handle { opacity: .8; }
.block-handle {
  position: absolute; left: 0; top: 3px; opacity: 0; user-select: none;
  display: flex; gap: 1px; transition: opacity .14s;
}
.block-handle button {
  width: 18px; height: 22px; padding: 0; display: grid; place-items: center;
  color: var(--cream-muted); font-size: 13px; border-radius: 2px;
}
.block-handle button:hover { background: var(--ink); color: var(--brass); }
.block-handle .grip { cursor: grab; font-size: 14px; }
.block-handle .grip:active { cursor: grabbing; }
.block-content {
  flex: 1; outline: none; min-height: 24px; padding: 2px 0;
  font-size: 15px; line-height: 1.55; word-wrap: break-word;
}
.block-content:empty:before, .block-content.is-empty:before {
  content: attr(data-placeholder); color: var(--cream-muted); pointer-events: none;
}
.block[data-type="h1"] .block-content { font-family: var(--serif); font-size: 28px; font-weight: 700; line-height: 1.2; padding: 14px 0 6px; }
.block[data-type="h2"] .block-content { font-family: var(--serif); font-size: 22px; font-weight: 700; line-height: 1.25; padding: 10px 0 4px; }
.block[data-type="h3"] .block-content { font-family: var(--serif); font-size: 17px; font-weight: 700; line-height: 1.3; padding: 8px 0 4px; color: var(--cream); }
.block[data-type="bullet"] { padding-left: 54px; }
.block[data-type="bullet"]:before { content: "•"; position: absolute; left: 36px; top: 4px; color: var(--cream-dim); font-size: 16px; }
.block[data-type="numbered"] { padding-left: 54px; }
.block[data-type="numbered"]:before { content: attr(data-n) "."; position: absolute; left: 32px; top: 4px; color: var(--cream-dim); font-size: 13px; font-family: var(--mono); }
.block[data-type="todo"] { padding-left: 54px; }
.block[data-type="todo"] .todo-check {
  position: absolute; left: 34px; top: 6px; width: 16px; height: 16px;
  border: 1.5px solid var(--cream-muted); border-radius: 3px; cursor: pointer;
  display: grid; place-items: center; font-size: 11px; color: var(--void);
  background: var(--void); flex-shrink: 0;
}
.block[data-type="todo"][data-checked="true"] .todo-check { background: var(--brass); border-color: var(--brass); color: var(--void); }
.block[data-type="todo"][data-checked="true"] .block-content { color: var(--cream-muted); text-decoration: line-through; }
.block[data-type="quote"] { padding-left: 40px; }
.block[data-type="quote"]:before { content: ""; position: absolute; left: 32px; top: 6px; bottom: 6px; width: 3px; background: var(--brass); }
.block[data-type="quote"] .block-content { font-style: italic; color: var(--cream-dim); }
.block[data-type="callout"] .block-content {
  background: var(--ink); border-left: 3px solid var(--brass); border-radius: 3px;
  padding: 10px 14px; font-size: 14px;
}
.block[data-type="code"] .block-content {
  font-family: var(--mono); font-size: 12.5px; background: var(--ink);
  padding: 12px 14px; border-radius: 4px; border: 1px solid var(--line);
  white-space: pre-wrap; tab-size: 2;
}
.block[data-type="divider"] { padding: 12px 32px; min-height: auto; }
.block[data-type="divider"] .block-content { display: none; }
.block[data-type="divider"]:before { content: ""; display: block; height: 1px; background: var(--line); width: 100%; }
.block[data-type="link-to-page"] .block-content {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px;
  background: var(--ink); border-radius: 3px; cursor: pointer; color: var(--brass);
  border: 1px solid var(--line);
}
.block[data-type="link-to-page"] .block-content:hover { background: var(--ink-hover); border-color: var(--brass); }
.block[data-type="link-to-page"] .block-content:before { content: "↪"; font-family: var(--mono); }
.block[data-type="toggle"] { padding-left: 48px; }
.block[data-type="toggle"] .toggle-arrow {
  position: absolute; left: 30px; top: 6px; width: 18px; height: 18px;
  display: grid; place-items: center; font-size: 10px; color: var(--cream-dim); cursor: pointer;
  user-select: none; transition: transform .15s;
}
.block[data-type="toggle"][data-open="true"] .toggle-arrow { transform: rotate(90deg); }
.toggle-children {
  margin-left: 22px; padding-left: 4px; border-left: 1px solid var(--line-soft);
  margin-top: 2px;
}
.block[data-type="toggle"][data-open="false"] + .toggle-children { display: none; }
.block[data-type="image"] { padding-left: 32px; }
.block[data-type="image"] .block-content {
  padding: 0; max-width: 100%; overflow: hidden;
}
.block[data-type="image"] img { max-width: 100%; max-height: 600px; border-radius: 4px; display: block; }
.block[data-type="image"] .img-placeholder {
  border: 2px dashed var(--line); border-radius: 4px; padding: 40px;
  text-align: center; color: var(--cream-muted); cursor: pointer; background: var(--ink);
}
.block[data-type="image"] .img-placeholder:hover { border-color: var(--brass); color: var(--brass); }
.block strong { color: var(--brass); font-weight: 600; }
.block em { font-style: italic; }
.block code { font-family: var(--mono); background: rgba(255,255,255,.06); padding: 1px 5px; border-radius: 2px; font-size: 12.5px; color: var(--brass); }
.block s, .block del { color: var(--cream-muted); }
.block a { color: var(--brass); text-decoration: underline; text-underline-offset: 2px; }
.wiki-link { color: var(--brass); border-bottom: 1px dashed var(--brass); cursor: pointer; padding: 0 1px; }
.wiki-link.broken { color: var(--ox); border-color: var(--ox); }

/* ─── Database ─── */
.db-wrap { margin: 12px 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.db-toolbar {
  padding: 8px 12px; border-bottom: 1px solid var(--line);
  display: flex; gap: 8px; align-items: center; background: var(--void-2); flex-wrap: wrap;
}
.db-toolbar .view-tab {
  padding: 4px 10px; border: 1px solid var(--line); background: transparent; border-radius: 3px;
  font-size: 11px; color: var(--cream-dim); font-family: var(--mono); letter-spacing: .04em;
}
.db-toolbar .view-tab:hover { border-color: var(--brass); color: var(--brass); }
.db-toolbar .view-tab.active { background: var(--brass); color: var(--void); border-color: var(--brass); font-weight: 600; }
.db-toolbar button.tool-btn {
  padding: 4px 10px; border: 1px solid var(--line); background: var(--ink); border-radius: 3px;
  font-size: 11px; color: var(--cream-dim); font-family: var(--mono); letter-spacing: .04em;
}
.db-toolbar button.tool-btn:hover { border-color: var(--brass); color: var(--brass); }
.db-toolbar .count {
  font-family: var(--mono); font-size: 10px; color: var(--cream-muted);
  letter-spacing: .08em; text-transform: uppercase; margin-left: auto;
}
.db-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.db-table th {
  background: var(--void-2); padding: 7px 11px; text-align: left;
  border-bottom: 1px solid var(--line); border-right: 1px solid var(--line-soft);
  font-family: var(--mono); font-size: 10px; color: var(--cream-muted); letter-spacing: .08em;
  text-transform: uppercase; font-weight: 500; user-select: none; cursor: pointer;
  position: relative;
}
.db-table th:hover { background: var(--ink); color: var(--cream-dim); }
.db-table th .prop-type { color: var(--violet); font-size: 9px; margin-left: 4px; }
.db-table th .sort-mark { color: var(--brass); margin-left: 4px; font-family: var(--mono); }
.db-table th.add-prop { color: var(--cream-muted); cursor: pointer; }
.db-table th.add-prop:hover { color: var(--brass); }
.db-table td {
  padding: 6px 10px; border-bottom: 1px solid var(--line-soft); border-right: 1px solid var(--line-soft);
  vertical-align: top; cursor: text;
}
.db-table tr:hover td { background: rgba(255,255,255,.02); }
.db-table tr:hover td.row-handle { background: var(--ink); }
.db-table td.row-handle { width: 30px; text-align: center; color: var(--cream-muted); cursor: pointer; user-select: none; padding: 6px 4px; }
.db-table td.row-handle:hover { color: var(--brass); }
.db-table td.title-cell { color: var(--brass); font-weight: 500; cursor: pointer; }
.db-table td.title-cell:hover { text-decoration: underline; }
.db-table td .cell-edit {
  outline: none; min-height: 18px; padding: 0; background: transparent; border: none;
  width: 100%; color: var(--cream); font-size: 13px; font-family: inherit;
}
.db-table td .cell-edit:focus { background: rgba(184,151,74,.06); }
.db-table .add-row-row td { padding: 6px 10px; color: var(--cream-muted); cursor: pointer; }
.db-table .add-row-row:hover td { color: var(--brass); background: var(--ink); }
.tag {
  display: inline-block; padding: 1px 7px; border-radius: 8px; font-size: 11px;
  margin: 1px 2px 1px 0; background: var(--ink); border: 1px solid var(--line);
}
.tag[data-color="green"] { background: rgba(74,222,128,.16); color: var(--green); border-color: var(--green); }
.tag[data-color="amber"] { background: rgba(255,140,0,.16); color: var(--amber); border-color: var(--amber); }
.tag[data-color="red"] { background: rgba(239,68,68,.16); color: var(--red); border-color: var(--red); }
.tag[data-color="blue"] { background: rgba(96,165,250,.16); color: var(--blue); border-color: var(--blue); }
.tag[data-color="violet"] { background: rgba(168,85,247,.16); color: var(--violet); border-color: var(--violet); }
.tag[data-color="pink"] { background: rgba(236,72,153,.16); color: var(--pink); border-color: var(--pink); }
.tag[data-color="teal"] { background: rgba(20,184,166,.16); color: var(--teal); border-color: var(--teal); }
.checkbox-cell { font-size: 16px; color: var(--cream-muted); cursor: pointer; user-select: none; }
.checkbox-cell.checked { color: var(--brass); }

/* Board view */
.db-board {
  display: flex; gap: 12px; padding: 14px; overflow-x: auto; align-items: flex-start; min-height: 320px;
}
.board-col {
  flex: 0 0 280px; background: var(--void-2); border: 1px solid var(--line);
  border-radius: 4px; display: flex; flex-direction: column; max-height: 70vh;
}
.board-col .board-head {
  padding: 9px 12px; border-bottom: 1px solid var(--line-soft); display: flex;
  align-items: center; gap: 8px; user-select: none;
}
.board-col .board-head .ttl { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; color: var(--cream); }
.board-col .board-head .count { font-family: var(--mono); font-size: 10px; color: var(--cream-muted); }
.board-col .board-head .add { margin-left: auto; padding: 2px 8px; color: var(--cream-muted); font-size: 14px; cursor: pointer; border-radius: 2px; }
.board-col .board-head .add:hover { color: var(--brass); background: var(--ink); }
.board-col .board-list { padding: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 30px; }
.board-card {
  background: var(--ink); border: 1px solid var(--line); border-radius: 3px;
  padding: 8px 11px; cursor: pointer; transition: border-color .12s;
}
.board-card:hover { border-color: var(--brass); }
.board-card.is-dragging { opacity: .35; }
.board-card .bc-title { font-size: 13px; color: var(--cream); font-weight: 500; margin-bottom: 4px; }
.board-card .bc-meta { display: flex; flex-wrap: wrap; gap: 3px; font-size: 11px; }
.board-col.drag-over { background: rgba(184,151,74,.06); border-color: var(--brass); }

/* Calendar view */
.db-cal { padding: 12px; }
.cal-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; font-family: var(--mono); font-size: 12px; }
.cal-head button { padding: 4px 10px; border: 1px solid var(--line); background: var(--ink); border-radius: 3px; color: var(--cream-dim); }
.cal-head button:hover { border-color: var(--brass); color: var(--brass); }

    // Wire interactions
    $('#fk-tier').onchange = () => {

    $('#fk-provider') && ($('#fk-provider').onchange = () => {

    });

      if (STATE.mesh.active) { STATE.mesh.bc?.close(); STATE.mesh.active = false; STATE.mesh.bc = null; notify('Mesh disconnected'); }
      else meshStart({ seedName: STATE.config.seedName || 'seed' });

    $('#fk-save').onclick = () => {
      STATE.config.ai_tier = $('#fk-tier').value;

  }
  function closeSettings() { const bg = $('#fk-modal-bg'); if (bg) bg.remove(); }

  // ─── Help section (returns HTML string for inclusion in seed Help tabs) ───
  function helpSection() {
    return `<div style="background:rgba(192,138,58,.05);border:1px solid #3a342c;border-radius:4px;padding:18px 22px;margin:14px 0">
      <h4 style="font-family:Georgia,serif;font-size:15px;color:#c08a3a;margin-bottom:12px">◊ AI cascade · the 3 tiers</h4>
      <p style="font-size:13px;color:#a89e88;line-height:1.7;margin-bottom:10px">This seed runs fully without AI (<strong style="color:#c08a3a">T0</strong>, default). Enable a tier in settings if you want AI-assist features:</p>
      <table style="width:100%;border-collapse:collapse;font-size:12.5px">
        <thead><tr><th style="padding:6px 10px;text-align:left;background:rgba(0,0,0,.2);font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#a89e88;letter-spacing:.08em;text-transform:uppercase">Tier</th><th style="padding:6px 10px;text-align:left;background:rgba(0,0,0,.2);font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#a89e88;letter-spacing:.08em;text-transform:uppercase">What it is</th></tr></thead>
        <tbody>
          <tr><td style="padding:6px 10px;border-top:1px solid #2a2934;color:#c08a3a;font-weight:600">T0</td><td style="padding:6px 10px;border-top:1px solid #2a2934;color:#a89e88">Off. The seed works fully. No AI · no downloads · no API calls.</td></tr>
          <tr><td style="padding:6px 10px;border-top:1px solid #2a2934;color:#c08a3a;font-weight:600">T2</td><td style="padding:6px 10px;border-top:1px solid #2a2934;color:#a89e88">WebLLM in-browser. Pick a model: 1B (700MB, fast) → 3B (2GB, balanced) → 7B (5GB, capable) → 70B (40GB, frontier). One-time download, runs offline forever after. Zero data leaves your device.</td></tr>
          <tr><td style="padding:6px 10px;border-top:1px solid #2a2934;color:#c08a3a;font-weight:600">T3</td><td style="padding:6px 10px;border-top:1px solid #2a2934;color:#a89e88">BYOK · Anthropic Claude · OpenAI GPT · Google Gemini. You bring the API key, you pay the provider direct. Key stays in your browser, sent direct to the provider, never proxied.</td></tr>

    </div>`;
  }

  // ─── CSS for AI chip ─────────────────────────────────────────────
  function injectCss() {
    if (document.getElementById('fk-css')) return;
    const s = document.createElement('style');
    s.id = 'fk-css';
    s.textContent = `
      #fk-ai-chip { display:inline-flex; align-items:center; gap:6px; padding:4px 9px; border-radius:3px; font-family:ui-monospace,Menlo,monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; font-weight:600; cursor:pointer; border:1px solid #3a342c; background:#1a1922; color:#a89e88; user-select:none; vertical-align:middle }
      #fk-ai-chip:hover { border-color:#c08a3a; color:#ebe3d2 }
      #fk-ai-chip.fk-chip-live { border-color:#6b8d4a; color:#6b8d4a; background:rgba(107,141,74,.10) }
      #fk-ai-chip.fk-chip-loading { border-color:#e8a83a; color:#e8a83a; background:rgba(232,168,58,.10) }
      #fk-ai-chip.fk-chip-warn { border-color:#a14a2a; color:#a14a2a; background:rgba(161,74,42,.08) }
      #fk-ai-chip .fk-dot { width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0 }
      #fk-ai-chip.fk-chip-loading .fk-dot { animation:fk-pulse 1s infinite }
      @keyframes fk-pulse { 0%,100%{opacity:1}50%{opacity:.3} }
      .fk-ai-assist { display:inline-flex; align-items:center; gap:5px; padding:4px 9px; font-size:11px; border:1px solid #c08a3a; color:#c08a3a; background:transparent; border-radius:3px; cursor:pointer; font-family:inherit }
      .fk-ai-assist:hover { background:#c08a3a; color:#0a0a0a }
      .fk-ai-assist::before { content:'✦'; font-size:12px }
    `;
    document.head.appendChild(s);
  }

  // ─── KCC Mint launcher (v1.2 · fork-this-seed shortcut) ──────────
  function openMint() {
    const slug = (STATE.config.seedName || location.hostname.split('.')[0] || 'seed').replace(/[^a-z0-9-]/gi, '-').toLowerCase();
    const name = document.title.replace(/^[◊·\s]+/, '').split('·')[0].trim() || slug;
    const url = location.href.split('?')[0].split('#')[0];
    const desc = document.querySelector('meta[name="description"]')?.content?.slice(0, 200) || '';
    const params = new URLSearchParams({ fork: '1', parent_slug: slug, parent_name: name, parent_url: url, parent_desc: desc });
    window.open(KCC_MINT_URL + '?' + params.toString(), '_blank', 'noopener');
  }

  // ─── Init ────────────────────────────────────────────────────────
  function init(opts) {
    opts = opts || {};
    injectCss();
    if (opts.seedName) STATE.config.seedName = opts.seedName;
    if ($('#fk-ai-chip')) { renderAiChip(); return { version: FALL_KIT_VERSION, mounted: false }; }
    const chip = document.createElement('button');
    chip.id = 'fk-ai-chip';
    chip.title = 'AI cascade · click to configure tier and model';
    chip.innerHTML = '<span class="fk-dot"></span><span id="fk-ai-chip-text">T0 · off</span>';
    chip.onclick = openSettings;
    // Try anchor first, fall back to floating bottom-right
    const anchor = opts.chipAnchor ? $(opts.chipAnchor) : null;
    if (anchor) { anchor.appendChild(chip); }
    else {
      chip.style.cssText += ';position:fixed;bottom:14px;left:14px;z-index:9998;box-shadow:0 4px 14px rgba(0,0,0,.4)';
      document.body.appendChild(chip);
    }
    // v1.2 · floating mint button next to chip
    if (!$('#fk-mint-btn') && !opts.hideMint) {
      const mintBtn = document.createElement('button');
      mintBtn.id = 'fk-mint-btn';
      mintBtn.title = 'Mint a fork of this seed as a KCC bundle · provenance economy';
      mintBtn.innerHTML = '<span style="font-size:13px">✦</span> mint fork';
      mintBtn.style.cssText = 'position:fixed;bottom:14px;left:130px;z-index:9998;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:3px;font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;cursor:pointer;border:1px solid #c08a3a;color:#c08a3a;background:rgba(10,10,15,.7);box-shadow:0 4px 14px rgba(0,0,0,.4)';
      mintBtn.onmouseover = () => { mintBtn.style.background = '#c08a3a'; mintBtn.style.color = '#0a0a0a'; };
      mintBtn.onmouseout  = () => { mintBtn.style.background = 'rgba(10,10,15,.7)'; mintBtn.style.color = '#c08a3a'; };
      mintBtn.onclick = openMint;
      document.body.appendChild(mintBtn);
    }
    renderAiChip();
    return { version: FALL_KIT_VERSION, mounted: true };
  }

  // ─── Public API ──────────────────────────────────────────────────
  root.FallKit = {
    version: FALL_KIT_VERSION,
    init: init,
    aiTier: aiTier,
    aiComplete: aiComplete,
    loadWebLLM: loadWebLLM,
    openSettings: openSettings,
    closeSettings: closeSettings,
    renderAiChip: renderAiChip,
    helpSection: helpSection,
    meshStart: meshStart,
    meshPost: meshPost,
    notify: notify,
    openMint: openMint,  // v1.2 · launch kcc-mint with this seed prefilled as parent
    MODELS: WEBLLM_MODELS,
    PROVIDERS: T3_PROVIDERS,
    state: STATE,
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

<script>
'use strict';

// ════════════════════════════════════════════════════════════════
// CONST
// ════════════════════════════════════════════════════════════════
const DB_NAME = 'fallnote_db';
const DB_VERSION = 2;
const BLOCK_TYPES = [
  { type: 'paragraph', label: 'Text', icon: '¶', hint: 'plain paragraph' },
  { type: 'h1',        label: 'Heading 1', icon: 'H₁', hint: 'big heading' },
  { type: 'h2',        label: 'Heading 2', icon: 'H₂', hint: 'medium heading' },
  { type: 'h3',        label: 'Heading 3', icon: 'H₃', hint: 'small heading' },
  { type: 'bullet',    label: 'Bullet list', icon: '•', hint: '- item' },
  { type: 'numbered',  label: 'Numbered list', icon: '1.', hint: '1. item' },
  { type: 'todo',      label: 'To-do', icon: '☐', hint: '[ ] task' },
  { type: 'toggle',    label: 'Toggle', icon: '▸', hint: 'collapsible' },
  { type: 'quote',     label: 'Quote', icon: '❝', hint: 'blockquote' },
  { type: 'callout',   label: 'Callout', icon: '◊', hint: 'highlighted box' },
  { type: 'code',      label: 'Code', icon: '</>', hint: 'code block' },
  { type: 'image',     label: 'Image', icon: '🖼', hint: 'paste, drag, or pick' },
  { type: 'divider',   label: 'Divider', icon: '—', hint: 'horizontal rule' },
  { type: 'link-to-page', label: 'Link to page', icon: '↪', hint: 'reference' },
];
const PROP_TYPES = [
  { type: 'text', label: 'Text' },
  { type: 'number', label: 'Number' },
  { type: 'date', label: 'Date' },
  { type: 'select', label: 'Select' },
  { type: 'multi-select', label: 'Multi-select' },
  { type: 'checkbox', label: 'Checkbox' },
];
const COLORS = ['green','amber','red','blue','violet','pink','teal'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

// ════════════════════════════════════════════════════════════════
// IndexedDB
// ════════════════════════════════════════════════════════════════
let db = null;
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = () => reject(req.error);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('pages')) {
        const s = d.createObjectStore('pages', { keyPath: 'id' });
        s.createIndex('parent', 'parent_page_id', { unique: false });
      }
      if (!d.objectStoreNames.contains('blocks')) {
        const s = d.createObjectStore('blocks', { keyPath: 'id' });
        s.createIndex('page', 'page_id', { unique: false });
      }
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'key' });
    };
    req.onsuccess = () => { db = req.result; resolve(db); };
  });
}
function tx(stores, mode='readonly') { return db.transaction(stores, mode); }
function dbGet(store, key) {
  return new Promise((resolve, reject) => {
    const r = tx([store]).objectStore(store).get(key);
    r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error);
  });
}
function dbGetAll(store) {
  return new Promise((resolve, reject) => {
    const r = tx([store]).objectStore(store).getAll();
    r.onsuccess = () => resolve(r.result || []); r.onerror = () => reject(r.error);
  });
}
function dbPut(store, value) {
  return new Promise((resolve, reject) => {
    const r = tx([store], 'readwrite').objectStore(store).put(value);
    r.onsuccess = () => resolve(value); r.onerror = () => reject(r.error);
  });
}
function dbDel(store, key) {
  return new Promise((resolve, reject) => {
    const r = tx([store], 'readwrite').objectStore(store).delete(key);
    r.onsuccess = () => resolve(); r.onerror = () => reject(r.error);
  });
}

// ════════════════════════════════════════════════════════════════
// State
// ════════════════════════════════════════════════════════════════
const state = {
  pages: new Map(), blocks: new Map(),
  currentPageId: null,
  treeExpanded: new Set(),
  toggleOpen: new Set(),       // block ids that are open
  filteredTree: null,
  favourites: [],
  recent: [],
  theme: 'dark',
  dbView: new Map(),           // dbId -> { kind: 'table'|'board'|'calendar', groupBy?, filterBy?, sortBy?, sortDir?, calMonth? }
  saveTimer: null,
};

const uid = (p='') => p + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const now = () => new Date().toISOString();
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.classList.toggle('err', !!err); t.classList.add('show'); clearTimeout(t._to); t._to = setTimeout(() => t.classList.remove('show'), 2400); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function fmtDate(iso) { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return iso; return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); }
function ymd(d) { return d.toISOString().slice(0,10); }
function parseDate(s) { if (!s) return null; const d = new Date(s); return isNaN(d) ? null : d; }

// ════════════════════════════════════════════════════════════════
// Models
// ════════════════════════════════════════════════════════════════
function makePage(opts = {}) {
  return {
    id: uid('p_'),
    parent_page_id: opts.parent_page_id || null,
    title: opts.title || '',
    icon: opts.icon || '📄',
    cover: opts.cover || null,
    is_database: !!opts.is_database,
    is_row: !!opts.is_row,
    schema: opts.schema || null,
    properties: opts.properties || null,
    position: opts.position || 0,
    deleted_at: null,
    created_at: now(), updated_at: now(),
  };
}
function makeBlock(opts = {}) {
  return {
    id: uid('b_'),
    page_id: opts.page_id,
    parent_block_id: opts.parent_block_id || null,
    type: opts.type || 'paragraph',
    content: opts.content || '',
    checked: opts.checked || false,
    page_link_id: opts.page_link_id || null,
    image_data: opts.image_data || null,
    position: opts.position || 0,
    deleted_at: null,
    created_at: now(), updated_at: now(),
  };
}
function dbSchemaDefault() {
  return {
    properties: [
      { key: 'title', name: 'Name', type: 'title' },
      { key: 'status', name: 'Status', type: 'select', options: [
          {name:'Todo', color:'amber'}, {name:'Doing', color:'blue'}, {name:'Done', color:'green'}] },
      { key: 'due', name: 'Due', type: 'date' },
      { key: 'tags', name: 'Tags', type: 'multi-select', options: [] },
      { key: 'notes', name: 'Notes', type: 'text' },
    ]
  };
}

async function loadAll() {
  const pages = await dbGetAll('pages');
  const blocks = await dbGetAll('blocks');
  state.pages.clear(); state.blocks.clear();
  for (const p of pages) state.pages.set(p.id, p);
  for (const b of blocks) state.blocks.set(b.id, b);
  // meta
  const fav = await dbGet('meta', 'favourites'); if (fav) state.favourites = fav.value || [];
  const rec = await dbGet('meta', 'recent'); if (rec) state.recent = rec.value || [];
  const th = await dbGet('meta', 'theme'); if (th) state.theme = th.value || 'dark';
  applyTheme();
}
function applyTheme() { document.documentElement.classList.toggle('light', state.theme === 'light'); }
async function toggleTheme() { state.theme = state.theme === 'dark' ? 'light' : 'dark'; await dbPut('meta', { key: 'theme', value: state.theme }); applyTheme(); }

async function savePage(p) { p.updated_at = now(); state.pages.set(p.id, p); await dbPut('pages', p); }
async function saveBlock(b) { b.updated_at = now(); state.blocks.set(b.id, b); await dbPut('blocks', b); }
async function deletePage(id, hard=false) {
  const p = state.pages.get(id); if (!p) return;
  if (hard) {
    state.pages.delete(id); await dbDel('pages', id);
    const bls = Array.from(state.blocks.values()).filter(b => b.page_id === id);
    for (const b of bls) { state.blocks.delete(b.id); await dbDel('blocks', b.id); }
    const children = Array.from(state.pages.values()).filter(c => c.parent_page_id === id);
    for (const c of children) await deletePage(c.id, true);
  } else {
    p.deleted_at = now(); await savePage(p);
    const children = Array.from(state.pages.values()).filter(c => c.parent_page_id === id && !c.deleted_at);
    for (const c of children) await deletePage(c.id, false);
  }
}
async function restorePage(id) {
  const p = state.pages.get(id); if (!p) return;
  p.deleted_at = null; await savePage(p);
}
async function deleteBlock(id) {
  state.blocks.delete(id); await dbDel('blocks', id);
}

function blocksFor(pageId, includeChildren=true) {
  return Array.from(state.blocks.values())
    .filter(b => b.page_id === pageId && !b.deleted_at && (includeChildren || !b.parent_block_id))
    .sort((a, b) => a.position - b.position);
}
function blocksUnder(pageId, parentBlockId=null) {
  return Array.from(state.blocks.values())
    .filter(b => b.page_id === pageId && !b.deleted_at && b.parent_block_id === parentBlockId)
    .sort((a, b) => a.position - b.position);
}
function childrenOf(parentId, includeDeleted=false) {
  return Array.from(state.pages.values())
    .filter(p => p.parent_page_id === parentId && (includeDeleted || !p.deleted_at))
    .sort((a, b) => a.position - b.position || a.created_at.localeCompare(b.created_at));
}
function pageById(id) { return state.pages.get(id); }
function pageByTitle(q) { const lq = q.toLowerCase(); return Array.from(state.pages.values()).find(p => !p.deleted_at && p.title.toLowerCase() === lq); }

// Recent tracking
async function pushRecent(pageId) {
  state.recent = [pageId, ...state.recent.filter(id => id !== pageId)].slice(0, 12);
  await dbPut('meta', { key: 'recent', value: state.recent });
}
async function toggleFav(pageId) {
  if (state.favourites.includes(pageId)) state.favourites = state.favourites.filter(id => id !== pageId);
  else state.favourites = [pageId, ...state.favourites];
  await dbPut('meta', { key: 'favourites', value: state.favourites });
  renderSidebar();
}

// ════════════════════════════════════════════════════════════════
// Markdown inline render
// ════════════════════════════════════════════════════════════════
function mdInline(s) {
  if (!s) return '';
  return esc(s)
    .replace(/\[\[([^\]]+)\]\]/g, (_, t) => {
      const p = pageByTitle(t);
      const cls = p ? 'wiki-link' : 'wiki-link broken';
      const dataId = p ? `data-page-id="${p.id}"` : '';
      return `<span class="${cls}" ${dataId} data-wiki="${esc(t)}">${esc(t)}</span>`;
    })
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|\s)\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/~~([^~\n]+)~~/g, '<s>$1</s>')
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function render() { renderSidebar(); renderContent(); }
function renderSidebar() {
  const tree = $('#pageTree');
  tree.innerHTML = '';
  if (state.filteredTree) {
    const pages = state.filteredTree.map(id => state.pages.get(id)).filter(Boolean);
    if (!pages.length) tree.innerHTML = '<div class="empty">No matches.</div>';
    else {
      const sec = document.createElement('div'); sec.className = 'nav-section'; sec.textContent = 'Search results'; tree.appendChild(sec);
      for (const p of pages) { if (!p.deleted_at) tree.appendChild(renderTreeNode(p, 0, true)); }
    }
    return;
  }
  // Favourites
  const favs = state.favourites.map(id => state.pages.get(id)).filter(p => p && !p.deleted_at);
  if (favs.length) {
    const sec = document.createElement('div'); sec.className = 'nav-section'; sec.textContent = '★ Favourites'; tree.appendChild(sec);
    for (const p of favs) tree.appendChild(renderTreeNode(p, 0, true));
  }
  // Recent
  const recents = state.recent.map(id => state.pages.get(id)).filter(p => p && !p.deleted_at && !state.favourites.includes(p.id)).slice(0, 5);
  if (recents.length) {
    const sec = document.createElement('div'); sec.className = 'nav-section'; sec.textContent = '◷ Recent'; tree.appendChild(sec);
    for (const p of recents) tree.appendChild(renderTreeNode(p, 0, true));
  }
  // Workspace tree
  const sec2 = document.createElement('div'); sec2.className = 'nav-section'; sec2.textContent = '◊ Workspace'; tree.appendChild(sec2);
  const roots = childrenOf(null);
  if (!roots.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No pages yet. Click + Page above.'; tree.appendChild(e); return; }
  for (const p of roots) tree.appendChild(renderTreeNode(p, 0));
}
function renderTreeNode(p, depth, flat=false) {
  const wrap = document.createElement('div');
  const node = document.createElement('div');
  node.className = 'tree-node' + (state.currentPageId === p.id ? ' active' : '');
  node.dataset.pageId = p.id;
  node.draggable = true;
  const children = flat ? [] : childrenOf(p.id);
  const expanded = state.treeExpanded.has(p.id);
  const twirl = `<span class="twirl ${expanded ? 'open' : ''} ${children.length ? '' : 'empty'}">▶</span>`;
  const icon = `<span class="icon">${p.is_database ? '⛁' : (p.icon || '📄')}</span>`;
  const title = `<span class="title">${esc(p.title || 'Untitled')}</span>`;
  const starred = state.favourites.includes(p.id);
  const star = `<button class="row-star ${starred ? 'starred' : ''}" title="${starred ? 'Unstar' : 'Favourite'}">${starred ? '★' : '☆'}</button>`;
  const addBtn = `<button class="row-add" title="New child page">+</button>`;
  node.innerHTML = twirl + icon + title + star + addBtn;
  node.addEventListener('click', e => {
    if (e.target.classList.contains('twirl')) {
      if (expanded) state.treeExpanded.delete(p.id); else state.treeExpanded.add(p.id);
      renderSidebar();
    } else if (e.target.classList.contains('row-add')) {
      e.stopPropagation(); newPage(p.id);
    } else if (e.target.classList.contains('row-star')) {
      e.stopPropagation(); toggleFav(p.id);
    } else openPage(p.id);
  });
  // drag-drop for tree reorder
  node.addEventListener('dragstart', e => { e.dataTransfer.setData('text/page-id', p.id); e.dataTransfer.effectAllowed = 'move'; });
  node.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
  node.addEventListener('drop', async e => {
    e.preventDefault(); e.stopPropagation();
    const draggedId = e.dataTransfer.getData('text/page-id');
    if (!draggedId || draggedId === p.id) return;
    const dragged = state.pages.get(draggedId); if (!dragged) return;
    // Move dragged to be a sibling AFTER target
    dragged.parent_page_id = p.parent_page_id;
    await savePage(dragged);
    renderSidebar();
  });
  wrap.appendChild(node);
  if (expanded && children.length) {
    const childWrap = document.createElement('div'); childWrap.className = 'tree-children';
    for (const c of children) childWrap.appendChild(renderTreeNode(c, depth + 1));
    wrap.appendChild(childWrap);
  }
  return wrap;
}

function renderContent() {

        <p>Click <strong>+ Page</strong> in the sidebar to start.<br>
        Press <kbd style="font-family:var(--mono);background:var(--ink);padding:2px 6px;border-radius:2px;font-size:11px;border:1px solid var(--line);">Ctrl/Cmd + K</kbd> for the command palette.</p>

}

function renderPageHeader(p, extraBtns='') {
  const crumbs = buildCrumbs(p);
  const isFav = state.favourites.includes(p.id);
  return `
    ${renderCover(p)}
    <div class="page-wrap">
      <div class="page-header">
        <div class="page-meta">
          <div class="crumb">${crumbs.map((c,i) => `<a data-page-id="${c.id}">${esc(c.title || 'Untitled')}</a>${i < crumbs.length-1 ? '<span class="sep">›</span>' : ''}`).join('')}</div>
          <button class="action-btn" onclick="toggleFav('${p.id}')" title="Favourite">${isFav ? '★' : '☆'}</button>
          ${!p.cover ? `<button class="action-btn" onclick="pickCover()" title="Add cover">＋ Cover</button>` : ''}
          ${extraBtns}
          <button class="action-btn" onclick="newSubPage('${p.id}')" title="New sub-page">+ Sub</button>
          <button class="action-btn danger" onclick="deleteCurrentPage()" title="Move to trash">🗑</button>
        </div>
        <div class="page-icon-row">
          <div class="page-icon" onclick="changePageIcon()">${p.icon || '📄'}</div>
          <div class="page-title" contenteditable="true" data-placeholder="Untitled" oninput="onTitleInput(this)" onkeydown="onTitleKey(event)">${esc(p.title || '')}</div>

      </div>`;
}
function renderCover(p) {
  if (!p.cover) return '';
  return `<div class="page-cover" style="background-image:url(${p.cover})">
    <div class="cover-actions">
      <button onclick="pickCover()">Change</button>
      <button onclick="removeCover()">Remove</button>
    </div>
  </div>`;
}

function renderPage(p) {
  const content = $('#content');
  content.innerHTML = renderPageHeader(p, `<button class="action-btn" onclick="exportPageMd('${p.id}')" title="Export markdown">⤓ MD</button>`) + `
      <div class="block-list" id="blockList"></div>
      <div class="backlinks" id="backlinks"></div>
    </div>`;
  $$('#content .crumb a').forEach(a => a.addEventListener('click', () => openPage(a.dataset.pageId)));
  renderBlocks(p);
  renderBacklinks(p);
}

function renderBlocks(p) {
  const list = $('#blockList');
  list.innerHTML = '';
  let blocks = blocksUnder(p.id, null);
  if (blocks.length === 0) {
    const b = makeBlock({ page_id: p.id, position: 0 });
    saveBlock(b);
    blocks = [b];
  }
  for (const b of blocks) list.appendChild(renderBlock(b, p.id));
  renumber(list);
}
function renumber(container) {
  let count = 0;
  container.querySelectorAll(':scope > .block').forEach(el => {
    if (el.dataset.type === 'numbered') { count += 1; el.dataset.n = String(count); }
    else { count = 0; }
  });
}
function renderBlock(b, pageId) {
  const el = document.createElement('div');
  el.className = 'block';
  el.dataset.blockId = b.id;
  el.dataset.type = b.type;
  el.draggable = true;
  if (b.type === 'todo') el.dataset.checked = String(b.checked || false);
  if (b.type === 'toggle') el.dataset.open = String(state.toggleOpen.has(b.id));
  let inner = '';
  if (b.type === 'todo') inner += `<div class="todo-check" onclick="toggleTodo('${b.id}')">${b.checked ? '✓' : ''}</div>`;
  if (b.type === 'toggle') inner += `<div class="toggle-arrow" onclick="toggleToggleBlock('${b.id}')">▶</div>`;
  if (b.type === 'divider') {
    inner += '<div class="block-content" data-placeholder="" tabindex="-1"></div>';
  } else if (b.type === 'link-to-page') {
    const linked = pageById(b.page_link_id);
    inner += `<div class="block-content" onclick="openPage('${b.page_link_id}')">${linked ? esc(linked.title || 'Untitled') : '<em>broken link</em>'}</div>`;
  } else if (b.type === 'image') {
    if (b.image_data) inner += `<div class="block-content"><img src="${b.image_data}" alt=""></div>`;
    else inner += `<div class="block-content"><div class="img-placeholder" onclick="pickImageFor('${b.id}')">⬆ Click to upload an image, or paste/drop it here</div></div>`;
  } else {
    const placeholder = b.position === 0 ? 'Type / for blocks, [[ to link, or just write…' : '';
    inner += `<div class="block-content" contenteditable="true" data-placeholder="${placeholder}">${mdInline(b.content)}</div>`;
  }
  inner += `<div class="block-handle"><button class="grip" title="Drag · click to add">⋮⋮</button><button onclick="openBlockMenu('${b.id}', this)" title="Block menu">⋯</button></div>`;
  el.innerHTML = inner;
  const ce = el.querySelector('.block-content[contenteditable]');
  if (ce) {
    ce.addEventListener('input', () => onBlockInput(b.id, ce));
    ce.addEventListener('keydown', e => onBlockKeydown(e, b.id, ce));
    ce.addEventListener('blur', () => onBlockBlur(b.id, ce));
    ce.addEventListener('paste', e => onBlockPaste(e, b.id, ce));
    ce.addEventListener('click', e => {
      const wiki = e.target.closest('.wiki-link');
      if (wiki) {
        if (wiki.dataset.pageId) openPage(wiki.dataset.pageId);
        else if (wiki.dataset.wiki) createPageFromWiki(wiki.dataset.wiki);
      }
    });
  }
  // image drag-drop on the placeholder
  if (b.type === 'image' && !b.image_data) {
    const ph = el.querySelector('.img-placeholder');
    if (ph) {
      ph.addEventListener('dragover', e => { e.preventDefault(); ph.style.borderColor = 'var(--brass)'; });
      ph.addEventListener('dragleave', () => { ph.style.borderColor = ''; });
      ph.addEventListener('drop', e => { e.preventDefault(); ph.style.borderColor = ''; const f = e.dataTransfer.files?.[0]; if (f) loadImageFile(f, b.id); });
    }
  }
  // block drag-drop reorder
  el.addEventListener('dragstart', e => {
    if (e.target.closest('.block-content')) { e.preventDefault(); return; }
    el.classList.add('is-dragging');
    e.dataTransfer.setData('text/block-id', b.id);
    e.dataTransfer.effectAllowed = 'move';
  });
  el.addEventListener('dragend', () => { el.classList.remove('is-dragging'); });
  el.addEventListener('dragover', e => {
    if (!e.dataTransfer.types.includes('text/block-id')) return;
    e.preventDefault();
    const rect = el.getBoundingClientRect();
    const before = e.clientY < rect.top + rect.height / 2;
    el.classList.toggle('drag-over-top', before);
    el.classList.toggle('drag-over-bot', !before);
  });
  el.addEventListener('dragleave', () => { el.classList.remove('drag-over-top','drag-over-bot'); });
  el.addEventListener('drop', async e => {
    if (!e.dataTransfer.types.includes('text/block-id')) return;
    e.preventDefault(); e.stopPropagation();
    el.classList.remove('drag-over-top','drag-over-bot');
    const draggedId = e.dataTransfer.getData('text/block-id');
    if (!draggedId || draggedId === b.id) return;
    const rect = el.getBoundingClientRect();
    const before = e.clientY < rect.top + rect.height / 2;
    await moveBlock(draggedId, b.id, before);
  });
  return el;
}

async function moveBlock(draggedId, targetId, before) {
  const d = state.blocks.get(draggedId); const t = state.blocks.get(targetId);
  if (!d || !t) return;
  const p = pageById(d.page_id); if (!p) return;
  const siblings = blocksUnder(d.page_id, t.parent_block_id);
  const others = siblings.filter(b => b.id !== draggedId);
  const tIdx = others.findIndex(b => b.id === targetId);
  const insertIdx = before ? tIdx : tIdx + 1;
  const newOrder = [...others.slice(0, insertIdx), d, ...others.slice(insertIdx)];
  d.parent_block_id = t.parent_block_id;
  for (let i = 0; i < newOrder.length; i++) { newOrder[i].position = i; await saveBlock(newOrder[i]); }
  renderBlocks(p);
}

function buildCrumbs(p) {
  const arr = []; let cur = p;
  while (cur) { arr.unshift({ id: cur.id, title: cur.title }); cur = cur.parent_page_id ? pageById(cur.parent_page_id) : null; }
  return arr;
}

function getDbView(dbId) {
  if (!state.dbView.has(dbId)) state.dbView.set(dbId, { kind: 'table', groupBy: 'status', sortBy: null, sortDir: 'asc', filterBy: [], calMonth: ymd(new Date()).slice(0,7) });
  return state.dbView.get(dbId);
}

function renderDatabase(p) {
  const content = $('#content');
  if (!p.schema) { p.schema = dbSchemaDefault(); savePage(p); }
  const view = getDbView(p.id);
  const rows = childrenOf(p.id).filter(r => !r.deleted_at);
  const filtered = applyFiltersSort(rows, p.schema, view);

  content.innerHTML = renderPageHeader(p, `<button class="action-btn" onclick="exportDbCsv('${p.id}')">⤓ CSV</button>`) + `
      <div class="db-wrap">
        <div class="db-toolbar">
          <button class="view-tab ${view.kind === 'table' ? 'active' : ''}" onclick="setDbView('${p.id}', 'table')">⊞ Table</button>
          <button class="view-tab ${view.kind === 'board' ? 'active' : ''}" onclick="setDbView('${p.id}', 'board')">⊟ Board</button>
          <button class="view-tab ${view.kind === 'calendar' ? 'active' : ''}" onclick="setDbView('${p.id}', 'calendar')">▦ Calendar</button>
          <button class="tool-btn" onclick="openDbFilterMenu('${p.id}', this)">⏷ Filter${view.filterBy?.length ? ` (${view.filterBy.length})` : ''}</button>
          <button class="tool-btn" onclick="openDbSortMenu('${p.id}', this)">⇅ Sort${view.sortBy ? ` (${view.sortBy})` : ''}</button>
          ${view.kind === 'board' ? `<button class="tool-btn" onclick="openBoardGroupMenu('${p.id}', this)">Group: ${view.groupBy || 'status'}</button>` : ''}
          <button class="tool-btn" onclick="newDbRow('${p.id}')">+ New row</button>
          <span class="count">${filtered.length} of ${rows.length} rows</span>
        </div>
        <div id="dbViewContent"></div>
      </div>
    </div>`;
  $$('#content .crumb a').forEach(a => a.addEventListener('click', () => openPage(a.dataset.pageId)));
  renderDbViewContent(p, filtered);
}

function setDbView(dbId, kind) { getDbView(dbId).kind = kind; renderDatabase(pageById(dbId)); }

function applyFiltersSort(rows, schema, view) {
  let out = [...rows];
  if (view.filterBy?.length) {
    out = out.filter(r => view.filterBy.every(f => {
      const v = f.key === 'title' ? r.title : r.properties?.[f.key];
      if (f.op === 'equals') return v === f.value || (Array.isArray(v) && v.includes(f.value));
      if (f.op === 'contains') return String(v || '').toLowerCase().includes(String(f.value || '').toLowerCase());
      if (f.op === 'checked') return !!v;
      if (f.op === 'unchecked') return !v;
      if (f.op === 'not_empty') return v != null && v !== '' && !(Array.isArray(v) && v.length === 0);
      return true;
    }));
  }
  if (view.sortBy) {
    const prop = schema.properties.find(p => p.key === view.sortBy);
    out.sort((a, b) => {
      let av = view.sortBy === 'title' ? a.title : a.properties?.[view.sortBy];
      let bv = view.sortBy === 'title' ? b.title : b.properties?.[view.sortBy];
      av = av == null ? '' : av; bv = bv == null ? '' : bv;
      if (prop?.type === 'number') return (Number(av) || 0) - (Number(bv) || 0);
      if (prop?.type === 'date') return String(av).localeCompare(String(bv));
      return String(av).localeCompare(String(bv));
    });
    if (view.sortDir === 'desc') out.reverse();
  }
  return out;
}

function renderDbViewContent(p, rows) {
  const view = getDbView(p.id);
  if (view.kind === 'table') renderDbTable(p, rows);
  else if (view.kind === 'board') renderDbBoard(p, rows);
  else if (view.kind === 'calendar') renderDbCalendar(p, rows);
}

function renderDbTable(p, rows) {
  const c = $('#dbViewContent');
  const props = p.schema.properties;
  const view = getDbView(p.id);
  let html = `<table class="db-table"><thead><tr>`;
  html += `<th class="row-handle" style="width:30px"></th>`;
  for (const prop of props) {
    const sortMark = view.sortBy === prop.key ? `<span class="sort-mark">${view.sortDir === 'desc' ? '↓' : '↑'}</span>` : '';
    html += `<th data-prop-key="${prop.key}" onclick="onColumnClick('${prop.key}', '${p.id}', event)">${esc(prop.name)}<span class="prop-type">${prop.type}</span>${sortMark}</th>`;
  }
  html += `<th class="add-prop" onclick="addDbProperty('${p.id}')">+</th></tr></thead><tbody>`;
  for (const row of rows) {
    html += `<tr data-row-id="${row.id}">`;
    html += `<td class="row-handle" onclick="openPage('${row.id}')" title="Open row">⋮</td>`;
    for (const prop of props) {
      const val = prop.key === 'title' ? row.title : row.properties?.[prop.key];
      html += renderDbCell(prop, val, row.id);
    }
    html += `<td></td></tr>`;
  }
  html += `<tr class="add-row-row"><td>＋</td><td colspan="${props.length + 1}" onclick="newDbRow('${p.id}')">＋ New row</td></tr>`;
  html += `</tbody></table>`;
  c.innerHTML = html;
  c.querySelectorAll('.cell-edit').forEach(el => {
    el.addEventListener('blur', () => onDbCellSave(el));
    el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
  });
  c.querySelectorAll('.checkbox-cell').forEach(el => el.addEventListener('click', () => onDbCheckboxToggle(el)));
  c.querySelectorAll('.select-cell').forEach(el => el.addEventListener('click', () => onDbSelectClick(el, p)));
}
function onColumnClick(key, dbId, e) {
  // Single click: sort. Click while sorted asc: toggle desc. Click again: unset.
  const view = getDbView(dbId);
  if (view.sortBy === key) {
    if (view.sortDir === 'asc') view.sortDir = 'desc';
    else { view.sortBy = null; view.sortDir = 'asc'; }
  } else { view.sortBy = key; view.sortDir = 'asc'; }
  renderDatabase(pageById(dbId));
}

function renderDbCell(prop, val, rowId) {
  const da = `data-row-id="${rowId}" data-prop-key="${prop.key}" data-prop-type="${prop.type}"`;
  if (prop.type === 'title') return `<td class="title-cell"><div class="cell-edit" contenteditable="true" ${da}>${esc(val || '')}</div></td>`;
  if (prop.type === 'text' || prop.type === 'number') return `<td><div class="cell-edit" contenteditable="true" ${da}>${esc(val == null ? '' : val)}</div></td>`;
  if (prop.type === 'date') {
    const display = val ? fmtDate(val) : '';
    return `<td><div class="cell-edit" contenteditable="true" ${da} data-raw="${esc(val || '')}">${esc(display)}</div></td>`;
  }
  if (prop.type === 'checkbox') return `<td><div class="checkbox-cell ${val ? 'checked' : ''}" ${da}>${val ? '☑' : '☐'}</div></td>`;
  if (prop.type === 'select') {
    const opt = prop.options?.find(o => o.name === val);
    const tag = opt ? `<span class="tag" data-color="${opt.color}">${esc(opt.name)}</span>` : '';
    return `<td><div class="select-cell" ${da} style="cursor:pointer;min-height:18px">${tag}</div></td>`;
  }
  if (prop.type === 'multi-select') {
    const vals = Array.isArray(val) ? val : (val ? [val] : []);
    const tags = vals.map(v => { const opt = prop.options?.find(o => o.name === v); return opt ? `<span class="tag" data-color="${opt.color}">${esc(opt.name)}</span>` : `<span class="tag">${esc(v)}</span>`; }).join('');
    return `<td><div class="select-cell" ${da} style="cursor:pointer;min-height:18px">${tags}</div></td>`;
  }
  return `<td></td>`;
}

async function onDbCellSave(el) {
  const rowId = el.dataset.rowId; const key = el.dataset.propKey; const type = el.dataset.propType;
  const row = pageById(rowId); if (!row) return;
  let raw = el.innerText.trim();
  if (!row.properties) row.properties = {};
  let val = raw;
  if (type === 'number') val = raw === '' ? null : Number(raw);
  if (type === 'date') {
    if (raw === '') val = null;
    else { const d = new Date(raw); val = isNaN(d) ? raw : d.toISOString().slice(0, 10); }
  }
  if (key === 'title' || type === 'title') row.title = raw;
  row.properties[key] = val;
  await savePage(row);
  const parent = pageById(row.parent_page_id);
  if (parent) renderDatabase(parent);
}
async function onDbCheckboxToggle(el) {

async function onDbSelectClick(el, dbPage) {
  const rowId = el.dataset.rowId; const key = el.dataset.propKey; const propType = el.dataset.propType;
  const prop = dbPage.schema.properties.find(p => p.key === key); if (!prop) return;
  const rect = el.getBoundingClientRect();
  const pop = popup(rect.left, rect.bottom + 4);
  const row = pageById(rowId); if (!row.properties) row.properties = {};
  const current = row.properties[key];
  const items = (prop.options || []).map(opt => ({
    label: opt.name, color: opt.color,
    onClick: async () => {
      if (propType === 'multi-select') {
        const arr = Array.isArray(current) ? [...current] : (current ? [current] : []);
        if (arr.includes(opt.name)) row.properties[key] = arr.filter(v => v !== opt.name);
        else row.properties[key] = [...arr, opt.name];
      } else {
        row.properties[key] = (current === opt.name) ? null : opt.name;
        closePopup();
      }
      await savePage(row);
      renderDatabase(dbPage);
      if (propType === 'multi-select') onDbSelectClick(el, dbPage);
    }
  }));
  items.push({
    label: '+ New option', hint: 'add to schema',
    onClick: () => {
      closePopup();
      const name = prompt('Option name:'); if (!name) return;
      const color = COLORS[(prop.options || []).length % COLORS.length];
      prop.options = [...(prop.options || []), { name, color }];
      savePage(dbPage);
      if (propType === 'multi-select') {
        const arr = Array.isArray(current) ? [...current] : (current ? [current] : []);
        row.properties[key] = [...arr, name];
      } else row.properties[key] = name;
      savePage(row).then(() => renderDatabase(dbPage));
    }
  });
  for (const it of items) {
    const node = document.createElement('div'); node.className = 'pop-item';
    const colorEl = it.color ? `<span style="color:var(--${it.color});font-size:14px">●</span>` : `<span class="icon">＋</span>`;
    node.innerHTML = `${colorEl}<span class="label">${esc(it.label)}</span>${it.hint ? `<span class="hint">${esc(it.hint)}</span>` : ''}`;
    node.addEventListener('click', it.onClick);
    pop.appendChild(node);
  }
}

// Board view
function renderDbBoard(p, rows) {
  const c = $('#dbViewContent');
  const view = getDbView(p.id);
  const groupKey = view.groupBy || 'status';
  const groupProp = p.schema.properties.find(pr => pr.key === groupKey);
  let groups = [];
  if (groupProp && (groupProp.type === 'select')) {
    groups = (groupProp.options || []).map(o => ({ name: o.name, color: o.color, rows: rows.filter(r => r.properties?.[groupKey] === o.name) }));
    groups.push({ name: '(no value)', color: null, rows: rows.filter(r => !r.properties?.[groupKey]) });
  } else {
    groups = [{ name: '(all)', color: null, rows }];
  }
  let html = '<div class="db-board">';
  for (const g of groups) {
    html += `<div class="board-col" data-group="${esc(g.name)}"><div class="board-head">
      ${g.color ? `<span class="tag" data-color="${g.color}">${esc(g.name)}</span>` : `<span class="ttl">${esc(g.name)}</span>`}
      <span class="count">${g.rows.length}</span>
      <span class="add" onclick="newDbRowInGroup('${p.id}', '${groupKey}', '${esc(g.name).replace(/'/g, "\\'")}', this)">＋</span>
    </div><div class="board-list">`;
    for (const r of g.rows) {
      html += `<div class="board-card" draggable="true" data-row-id="${r.id}">
        <div class="bc-title">${esc(r.title || 'Untitled')}</div>
        <div class="bc-meta">`;
      for (const prop of p.schema.properties) {
        if (prop.key === 'title' || prop.key === groupKey) continue;
        const v = r.properties?.[prop.key]; if (v == null || v === '' || (Array.isArray(v) && v.length === 0)) continue;
        if (prop.type === 'select') { const opt = prop.options?.find(o=>o.name===v); html += `<span class="tag" data-color="${opt?.color}">${esc(v)}</span>`; }
        else if (prop.type === 'multi-select') html += (Array.isArray(v) ? v : [v]).map(x => { const opt = prop.options?.find(o=>o.name===x); return `<span class="tag" data-color="${opt?.color || ''}">${esc(x)}</span>`; }).join('');
        else if (prop.type === 'date') html += `<span style="color:var(--cream-muted);font-family:var(--mono);font-size:10px">📅 ${esc(fmtDate(v))}</span>`;
        else if (prop.type === 'checkbox') html += v ? '<span style="color:var(--brass)">☑</span>' : '';
        else html += `<span style="color:var(--cream-muted);font-size:11px">${esc(String(v).slice(0, 60))}</span>`;
      }
      html += `</div></div>`;
    }
    html += `</div></div>`;
  }
  html += '</div>';
  c.innerHTML = html;
  // wire drag-drop between columns
  c.querySelectorAll('.board-card').forEach(card => {
    card.addEventListener('click', e => { if (!card.classList.contains('is-dragging')) openPage(card.dataset.rowId); });
    card.addEventListener('dragstart', e => { card.classList.add('is-dragging'); e.dataTransfer.setData('text/row-id', card.dataset.rowId); e.dataTransfer.effectAllowed = 'move'; });
    card.addEventListener('dragend', () => card.classList.remove('is-dragging'));
  });
  c.querySelectorAll('.board-col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
    col.addEventListener('drop', async e => {
      e.preventDefault(); col.classList.remove('drag-over');
      const rowId = e.dataTransfer.getData('text/row-id'); if (!rowId) return;
      const row = pageById(rowId); if (!row) return;
      const newGroup = col.dataset.group;
      if (!row.properties) row.properties = {};
      row.properties[groupKey] = newGroup === '(no value)' ? null : newGroup;
      await savePage(row);
      renderDatabase(p);
    });
  });
}

// Calendar view
function renderDbCalendar(p, rows) {
  const c = $('#dbViewContent');
  const view = getDbView(p.id);
  const monthStr = view.calMonth || ymd(new Date()).slice(0,7);
  const [y, m] = monthStr.split('-').map(Number);
  // find date property
  const dateProp = p.schema.properties.find(pr => pr.type === 'date');
  if (!dateProp) { c.innerHTML = '<div style="padding:30px;text-align:center;color:var(--cream-muted)">Add a date property to use the calendar view.</div>'; return; }
  // build month grid
  const first = new Date(y, m - 1, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const todayStr = ymd(new Date());

  // events keyed by yyyy-mm-dd
  const events = {};
  for (const r of rows) {
    const v = r.properties?.[dateProp.key]; if (!v) continue;
    const k = String(v).slice(0, 10);
    if (!events[k]) events[k] = [];
    events[k].push(r);
  }

  let html = `<div class="db-cal">
    <div class="cal-head">
      <button onclick="calNav('${p.id}', -1)">‹</button>
      <span class="month-label">${MONTHS[m-1]} ${y}</span>
      <button onclick="calNav('${p.id}', 1)">›</button>
      <button onclick="calNav('${p.id}', 0)">Today</button>
      <span style="color:var(--cream-muted);font-size:11px;margin-left:10px">Date prop: <strong>${esc(dateProp.name)}</strong></span>
    </div>
    <div class="cal-grid">`;
  for (const d of DAYS) html += `<div class="cal-day-hdr">${d}</div>`;
  // leading blanks
  for (let i = 0; i < startWeekday; i++) {
    const d = new Date(y, m - 1, -startWeekday + i + 1);
    html += `<div class="cal-day other-month" onclick="calClickDay('${p.id}', '${ymd(d)}')"><div class="cal-num">${d.getDate()}</div></div>`;
  }
  // days
  for (let day = 1; day <= daysInMonth; day++) {
    const ds = `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isToday = ds === todayStr;
    let evHtml = '';
    if (events[ds]) for (const r of events[ds]) evHtml += `<div class="cal-event" onclick="event.stopPropagation();openPage('${r.id}')">${esc(r.title || 'Untitled')}</div>`;
    html += `<div class="cal-day ${isToday ? 'today' : ''}" onclick="calClickDay('${p.id}', '${ds}')"><div class="cal-num">${day}</div>${evHtml}</div>`;
  }
  // trailing
  const cells = startWeekday + daysInMonth; const trailing = (7 - (cells % 7)) % 7;
  for (let i = 0; i < trailing; i++) {
    const d = new Date(y, m - 1, daysInMonth + i + 1);
    html += `<div class="cal-day other-month" onclick="calClickDay('${p.id}', '${ymd(d)}')"><div class="cal-num">${d.getDate()}</div></div>`;
  }
  html += `</div></div>`;
  c.innerHTML = html;
}
function calNav(dbId, delta) {
  const view = getDbView(dbId);
  if (delta === 0) view.calMonth = ymd(new Date()).slice(0,7);
  else {
    const [y, m] = view.calMonth.split('-').map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    view.calMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }
  renderDatabase(pageById(dbId));
}
async function calClickDay(dbId, ds) {
  const dbPage = pageById(dbId); if (!dbPage) return;
  const dateProp = dbPage.schema.properties.find(p => p.type === 'date'); if (!dateProp) return;
  const row = makePage({ parent_page_id: dbId, title: '', icon: '·', position: childrenOf(dbId).length });
  row.is_row = true; row.properties = { [dateProp.key]: ds };
  await savePage(row);
  await saveBlock(makeBlock({ page_id: row.id, position: 0 }));
  openPage(row.id);
}

  const key = name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'prop_' + Date.now();

function exportDbCsv(dbId) {
  const p = pageById(dbId); if (!p) return;
  const rows = childrenOf(dbId).filter(r => !r.deleted_at);
  const props = p.schema.properties;
  const head = props.map(pr => pr.name);
  const data = rows.map(r => props.map(pr => {
    const v = pr.key === 'title' ? r.title : r.properties?.[pr.key];
    if (Array.isArray(v)) return `"${v.join('; ')}"`;
    if (v == null) return '';
    return /[,"\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
  }));
  const csv = [head.map(h => /[,"\n]/.test(h) ? `"${h.replace(/"/g, '""')}"` : h).join(','), ...data.map(r => r.join(','))].join('\n');
  downloadFile(csv, (p.title || 'database') + '.csv', 'text/csv');
  toast('CSV downloaded');
}

function onBlockInput(blockId, el) {
  const b = state.blocks.get(blockId); if (!b) return;
  b.content = el.innerText;
  clearTimeout(saveDebounce); saveDebounce = setTimeout(() => saveBlock(b), 300);
  const text = el.innerText;
  if (text === '/' || text.startsWith('/')) showSlashMenu(blockId, el, text.slice(1));
  else closePopup('slash');
  const sel = window.getSelection();
  if (sel.rangeCount > 0) {
    const range = sel.getRangeAt(0);
    const before = (range.startContainer.textContent || '').slice(0, range.startOffset);
    const m = before.match(/\[\[([^\]\n]*)$/);
    if (m) showWikiMenu(blockId, el, m[1]); else closePopup('wiki');
  }
}
async function onBlockBlur(blockId, el) {
  const b = state.blocks.get(blockId); if (!b) return;
  if (b.content !== el.innerText) { b.content = el.innerText; await saveBlock(b); }
  if (b.type !== 'image' && b.type !== 'divider' && b.type !== 'link-to-page') el.innerHTML = mdInline(b.content);
}
function onBlockPaste(e, blockId, el) {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      const f = item.getAsFile(); if (f) loadImageFile(f, blockId);
      return;
    }
  }
}
function onBlockKeydown(e, blockId, el) {
  const b = state.blocks.get(blockId); if (!b) return;
  if (currentPopup && (currentPopupKind === 'slash' || currentPopupKind === 'wiki')) {
    if (e.key === 'ArrowDown') { e.preventDefault(); popupMove(1); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); popupMove(-1); return; }
    if (e.key === 'Enter') { e.preventDefault(); popupChoose(); return; }
    if (e.key === 'Escape') { e.preventDefault(); closePopup(); return; }
  }
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const carry = (b.type === 'numbered' || b.type === 'bullet' || b.type === 'todo') ? b.type : 'paragraph';
    addBlockAfter(blockId, carry); return;
  }
  if (e.key === 'Backspace' && el.innerText === '' && b.position > 0) { e.preventDefault(); mergeBlockBack(blockId); return; }
  if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '  '); return; }
}

async function addBlockAfter(blockId, type='paragraph') {
  const b = state.blocks.get(blockId); if (!b) return;
  const p = pageById(b.page_id); if (!p) return;
  const newB = makeBlock({ page_id: p.id, type, parent_block_id: b.parent_block_id, position: b.position + 1 });
  const sibs = blocksUnder(p.id, b.parent_block_id).filter(x => x.position > b.position);
  for (const s of sibs) { s.position += 1; await saveBlock(s); }
  await saveBlock(newB);
  renderBlocks(p);
  setTimeout(() => { const el = document.querySelector(`.block[data-block-id="${newB.id}"] .block-content[contenteditable]`); if (el) el.focus(); }, 20);
}

async function mergeBlockBack(blockId) {
  const b = state.blocks.get(blockId); if (!b) return;
  const p = pageById(b.page_id); if (!p) return;
  const sibs = blocksUnder(p.id, b.parent_block_id);
  const idx = sibs.findIndex(x => x.id === blockId);
  if (idx <= 0) return;
  const prev = sibs[idx - 1];
  prev.content = (prev.content || '') + (b.content || '');
  await saveBlock(prev);
  await deleteBlock(b.id);
  renderBlocks(p);
  setTimeout(() => {
    const el = document.querySelector(`.block[data-block-id="${prev.id}"] .block-content[contenteditable]`);
    if (el) { el.focus(); const range = document.createRange(); const sel = window.getSelection(); range.selectNodeContents(el); range.collapse(false); sel.removeAllRanges(); sel.addRange(range); }
  }, 20);
}

async function setBlockType(blockId, newType) {
  const b = state.blocks.get(blockId); if (!b) return;
  b.type = newType;
  if (newType === 'divider') b.content = '';
  if (newType === 'toggle') state.toggleOpen.add(blockId);
  await saveBlock(b);
  const p = pageById(b.page_id); renderBlocks(p);
}

async function openBlockMenu(blockId, btn) {
  const b = state.blocks.get(blockId); if (!b) return;
  const rect = btn.getBoundingClientRect(); const pop = popup(rect.left - 200, rect.bottom + 2);
  const sec = document.createElement('div'); sec.className = 'pop-section'; sec.textContent = 'Turn into'; pop.appendChild(sec);
  for (const t of BLOCK_TYPES) {
    const node = document.createElement('div'); node.className = 'pop-item';
    node.innerHTML = `<span class="icon">${t.icon}</span><span class="label">${esc(t.label)}</span>`;
    node.addEventListener('click', async () => { await setBlockType(blockId, t.type); closePopup(); });
    pop.appendChild(node);
  }
  const sec2 = document.createElement('div'); sec2.className = 'pop-section'; sec2.textContent = 'Actions'; pop.appendChild(sec2);
  const duplicate = document.createElement('div'); duplicate.className = 'pop-item';
  duplicate.innerHTML = `<span class="icon">⎘</span><span class="label">Duplicate</span>`;
  duplicate.addEventListener('click', async () => {
    const sibs = blocksUnder(b.page_id, b.parent_block_id).filter(x => x.position > b.position);
    for (const s of sibs) { s.position += 1; await saveBlock(s); }
    const copy = makeBlock({ page_id: b.page_id, parent_block_id: b.parent_block_id, type: b.type, content: b.content, checked: b.checked, image_data: b.image_data, position: b.position + 1 });
    await saveBlock(copy);
    const p = pageById(b.page_id); renderBlocks(p); closePopup();
  });
  pop.appendChild(duplicate);
  const del = document.createElement('div'); del.className = 'pop-item';
  del.innerHTML = `<span class="icon" style="color:var(--red)">✕</span><span class="label">Delete block</span>`;
  del.addEventListener('click', async () => { const p = pageById(b.page_id); await deleteBlock(blockId); if (p) renderBlocks(p); closePopup(); });
  pop.appendChild(del);
}

// Popups
// ════════════════════════════════════════════════════════════════
let currentPopup = null; let currentPopupKind = null; let currentPopupItems = []; let currentPopupIdx = 0;
function popup(x, y) {
  closePopup();
  const el = document.createElement('div'); el.className = 'popup';
  // ensure visible
  const w = Math.min(window.innerWidth - 20, 320);
  if (x + w > window.innerWidth) x = window.innerWidth - w - 12;
  if (x < 8) x = 8;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  document.body.appendChild(el);
  currentPopup = el; currentPopupKind = 'generic';
  setTimeout(() => document.addEventListener('click', popupOutsideClick), 0);
  return el;
}
function closePopup(kind) {
  if (kind && currentPopupKind !== kind) return;
  if (currentPopup) currentPopup.remove();
  currentPopup = null; currentPopupKind = null; currentPopupItems = []; currentPopupIdx = 0;
  document.removeEventListener('click', popupOutsideClick);
}
function popupOutsideClick(e) { if (currentPopup && !currentPopup.contains(e.target)) closePopup(); }
function popupMove(delta) {
  if (!currentPopupItems.length) return;
  currentPopupIdx = (currentPopupIdx + delta + currentPopupItems.length) % currentPopupItems.length;
  const items = currentPopup.querySelectorAll('.pop-item');
  items.forEach((it, i) => it.classList.toggle('active', i === currentPopupIdx));
  const active = items[currentPopupIdx]; if (active) active.scrollIntoView({ block: 'nearest' });
}
function popupChoose() { const it = currentPopupItems[currentPopupIdx]; if (it && it.onChoose) it.onChoose(); }

function showSlashMenu(blockId, blockEl, filter) {
  const rect = blockEl.getBoundingClientRect(); const pop = popup(rect.left, rect.bottom + 4);
  currentPopupKind = 'slash';
  const items = BLOCK_TYPES.filter(t => !filter || t.label.toLowerCase().includes(filter.toLowerCase()) || t.type.includes(filter.toLowerCase())).map(t => ({
    label: t.label, icon: t.icon, hint: t.hint,
    onChoose: async () => {
      const b = state.blocks.get(blockId); if (b) { b.content = ''; await saveBlock(b); }
      await setBlockType(blockId, t.type); closePopup();
      setTimeout(() => { const el = document.querySelector(`.block[data-block-id="${blockId}"] .block-content[contenteditable]`); if (el) el.focus(); }, 20);
    }
  }));
  currentPopupItems = items; currentPopupIdx = 0;
  if (!items.length) { closePopup(); return; }
  const sec = document.createElement('div'); sec.className = 'pop-section'; sec.textContent = 'Block types'; pop.appendChild(sec);
  for (const it of items) {
    const node = document.createElement('div'); node.className = 'pop-item';
    node.innerHTML = `<span class="icon">${it.icon}</span><span class="label">${esc(it.label)}</span><span class="hint">${esc(it.hint)}</span>`;
    node.addEventListener('click', it.onChoose);
    pop.appendChild(node);
  }
  popupMove(0);
}

function showWikiMenu(blockId, blockEl, filter) {
  const rect = blockEl.getBoundingClientRect(); const pop = popup(rect.left, rect.bottom + 4);
  currentPopupKind = 'wiki';
  const matches = Array.from(state.pages.values())
    .filter(p => !p.deleted_at && p.id !== state.currentPageId)
    .filter(p => !filter || (p.title || '').toLowerCase().includes((filter || '').toLowerCase()))
    .slice(0, 12);
  const items = matches.map(p => ({
    label: p.title || 'Untitled', icon: p.is_database ? '⛁' : (p.icon || '📄'),
    onChoose: async () => {
      const b = state.blocks.get(blockId); if (!b) return;
      const idx = b.content.lastIndexOf('[[');
      if (idx === -1) { closePopup(); return; }
      b.content = b.content.slice(0, idx) + '[[' + (p.title || 'Untitled') + ']]';
      await saveBlock(b);
      blockEl.innerText = b.content;
      const range = document.createRange(); range.selectNodeContents(blockEl); range.collapse(false);
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(range);
      closePopup();
    }
  }));
  if (filter && filter.trim()) {
    items.push({ label: 'Create page: ' + filter, icon: '＋', onChoose: async () => {
      closePopup();
      const np = makePage({ title: filter.trim() });
      await savePage(np);
      await saveBlock(makeBlock({ page_id: np.id, position: 0 }));
      const b = state.blocks.get(blockId); if (!b) return;
      const idx = b.content.lastIndexOf('[[');
      if (idx === -1) return;
      b.content = b.content.slice(0, idx) + '[[' + np.title + ']]';
      await saveBlock(b);
      renderBlocks(pageById(b.page_id)); renderSidebar();
    }});
  }
  currentPopupItems = items; currentPopupIdx = 0;
  if (!items.length) { closePopup(); return; }
  const sec = document.createElement('div'); sec.className = 'pop-section'; sec.textContent = 'Link to page'; pop.appendChild(sec);
  for (const it of items) {
    const node = document.createElement('div'); node.className = 'pop-item';
    node.innerHTML = `<span class="icon">${it.icon}</span><span class="label">${esc(it.label)}</span>`;
    node.addEventListener('click', it.onChoose);
    pop.appendChild(node);
  }
  popupMove(0);
}

async function createPageFromWiki(title) {
  const existing = pageByTitle(title);
  if (existing) { openPage(existing.id); return; }
  const np = makePage({ title }); await savePage(np);
  await saveBlock(makeBlock({ page_id: np.id, position: 0 }));
  openPage(np.id);
}
