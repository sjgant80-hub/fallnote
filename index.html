<style>
:root {
  --void:#0b0a0f; --void-2:#13121a; --ink:#1a1922; --ink-hover:#22212c;
  --line:#2a2934; --line-soft:#1f1e28;
  --cream:#e6e1d6; --cream-dim:#a8a395; --cream-muted:#6e6a5e;
  --brass:#b8974a; --amber:#ff8c00; --ox:#8b1a1a;
  --green:#4ade80; --red:#ef4444; --blue:#60a5fa; --yellow:#fbbf24; --violet:#a855f7; --pink:#ec4899; --teal:#14b8a6;
  --serif: Georgia, 'Libre Baskerville', ui-serif, serif;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', 'SF Mono', ui-monospace, Menlo, monospace;
  --sidebar-w: 260px;
}
html.light {
  --void:#fefdf7; --void-2:#f7f4e9; --ink:#eee9d8; --ink-hover:#e4ddc6;
  --line:#d8cfb2; --line-soft:#e6dfc6;
  --cream:#1a1815; --cream-dim:#42403a; --cream-muted:#7a766c;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--void); color: var(--cream); font: 14.5px/1.6 var(--sans);
  min-height: 100dvh; -webkit-font-smoothing: antialiased; overflow: hidden;
}
button { font-family: inherit; cursor: pointer; background: transparent; border: none; color: inherit; }
input, textarea, select {
  font-family: inherit; background: var(--ink); border: 1px solid var(--line);
  color: var(--cream); border-radius: 3px; padding: 7px 10px; outline: none; font-size: 13px;
}
input:focus, textarea:focus, select:focus { border-color: var(--brass); }
a { color: var(--brass); text-decoration: none; }
a:hover { text-decoration: underline; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--brass); }

/* ─── App layout ─── */
.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100dvh; }
.app.no-sidebar { grid-template-columns: 0 1fr; }

/* ─── Sidebar ─── */
aside.sidebar {
  background: var(--void-2); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; overflow: hidden;
}
aside.sidebar .brand {
  display: flex; align-items: center; gap: 10px; padding: 12px 18px;
  border-bottom: 1px solid var(--line); user-select: none;
}
aside.sidebar .brand .mark {
  width: 28px; height: 28px; background: linear-gradient(135deg, var(--brass), var(--amber));
  border-radius: 5px; display: grid; place-items: center;
  font-family: var(--serif); font-weight: 700; font-size: 16px; color: var(--void);
}
aside.sidebar .brand .name { font-family: var(--serif); font-weight: 700; font-size: 15px; }
aside.sidebar .brand .v { margin-left: auto; font-family: var(--mono); font-size: 9px; color: var(--cream-muted); letter-spacing: .12em; text-transform: uppercase; }
aside.sidebar .actions {
  padding: 8px 10px; display: flex; gap: 5px; flex-wrap: wrap;
  border-bottom: 1px solid var(--line-soft);
}
aside.sidebar .actions button {
  padding: 6px 9px; background: var(--ink); border: 1px solid var(--line);
  border-radius: 3px; font-size: 11px; color: var(--cream-dim); flex: 1; min-width: 0;
}
aside.sidebar .actions button:hover { background: var(--ink-hover); color: var(--cream); border-color: var(--brass); }
aside.sidebar .search-wrap { padding: 8px 10px; border-bottom: 1px solid var(--line-soft); }
aside.sidebar .search-wrap input { width: 100%; font-size: 12px; padding: 6px 9px; }
aside.sidebar .nav-section {
  padding: 6px 14px; font-family: var(--mono); font-size: 9px; color: var(--cream-muted);
  letter-spacing: .12em; text-transform: uppercase; margin-top: 8px;
}
aside.sidebar nav.tree {
  flex: 1; overflow-y: auto; padding: 0 6px 24px;
}
aside.sidebar nav.tree .empty {
  padding: 18px 14px; color: var(--cream-muted); font-size: 12px; text-align: center;
}
.tree-node {
  display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 3px;
  cursor: pointer; font-size: 13px; color: var(--cream-dim); user-select: none;
  white-space: nowrap; overflow: hidden;
}
.tree-node:hover { background: var(--ink); color: var(--cream); }
.tree-node.active { background: rgba(184,151,74,.14); color: var(--brass); }
.tree-node .twirl {
  width: 14px; height: 14px; display: grid; place-items: center; flex-shrink: 0;
  font-size: 9px; color: var(--cream-muted); transition: transform .14s;
}
.tree-node .twirl.empty { visibility: hidden; }
.tree-node .twirl.open { transform: rotate(90deg); }
.tree-node .icon { flex-shrink: 0; font-size: 13px; }
.tree-node .title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.tree-node .row-add, .tree-node .row-star {
  opacity: 0; flex-shrink: 0; padding: 2px 5px; font-size: 13px; color: var(--cream-muted);
  border-radius: 2px;
}
.tree-node:hover .row-add, .tree-node:hover .row-star { opacity: 1; }
.tree-node .row-star.starred { opacity: 1; color: var(--brass); }
.tree-node .row-add:hover { background: var(--brass); color: var(--void); }
.tree-node .row-star:hover { color: var(--brass); }
.tree-children { padding-left: 14px; }

aside.sidebar footer {
  padding: 8px 10px; border-top: 1px solid var(--line-soft); display: flex; gap: 4px;
  font-family: var(--mono); font-size: 10px; color: var(--cream-muted); letter-spacing: .04em;
}
aside.sidebar footer button { padding: 5px 7px; border-radius: 2px; flex-shrink: 0; }
aside.sidebar footer button:hover { background: var(--ink); color: var(--brass); }

/* ─── Main content ─── */
main.content { overflow-y: auto; padding: 0 0 200px; position: relative; }
main.content .page-wrap { max-width: 880px; margin: 0 auto; padding: 0 clamp(20px, 6vw, 100px); }
main.content .empty-page {
  max-width: 720px; margin: 80px auto; text-align: center; color: var(--cream-muted);
}
main.content .empty-page h2 { font-family: var(--serif); font-size: 22px; color: var(--brass); margin-bottom: 8px; }
main.content .empty-page p { font-size: 14px; line-height: 1.6; margin-bottom: 16px; }
main.content .empty-page button {
  padding: 9px 16px; background: var(--brass); color: var(--void); font-weight: 600;
  font-size: 13px; border-radius: 3px;
}
main.content .empty-page button:hover { background: var(--amber); }

/* Page cover */
.page-cover {
  height: 180px; background-size: cover; background-position: center; position: relative; cursor: pointer;
  background-color: var(--ink);
}
.page-cover.empty { height: 24px; background: linear-gradient(180deg, var(--void-2), var(--void)); cursor: default; }
.page-cover .cover-actions { position: absolute; right: 16px; bottom: 12px; display: none; gap: 6px; }
.page-cover:hover .cover-actions { display: flex; }
.page-cover .cover-actions button { padding: 5px 11px; font-size: 11px; background: rgba(0,0,0,.55); color: var(--cream); border-radius: 3px; backdrop-filter: blur(4px); }
.add-cover-btn { display: inline-block; font-size: 12px; color: var(--cream-muted); padding: 6px 0; cursor: pointer; }
.add-cover-btn:hover { color: var(--brass); }

.page-header { padding: 22px 0 18px; }
.page-meta {
  display: flex; align-items: center; gap: 12px; padding: 6px 0;
  font-family: var(--mono); font-size: 11px; color: var(--cream-muted); letter-spacing: .04em;
  flex-wrap: wrap;
}
.page-meta .crumb a { color: var(--cream-muted); }
.page-meta .crumb a:hover { color: var(--brass); }
.page-meta .crumb .sep { margin: 0 4px; color: var(--line); }
.page-meta .action-btn {
  padding: 3px 9px; border: 1px solid var(--line); border-radius: 3px;
  background: var(--ink); color: var(--cream-dim); font-size: 10px;
}
.page-meta .action-btn:hover { border-color: var(--brass); color: var(--brass); }
.page-meta .action-btn.danger:hover { border-color: var(--red); color: var(--red); }
.page-icon-row { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; margin-top: 8px; }
.page-icon { font-size: 42px; line-height: 1; padding: 4px 8px; border-radius: 4px; cursor: pointer; user-select: none; }
.page-icon:hover { background: var(--ink); }
.page-title {
  font-family: var(--serif); font-weight: 700; font-size: 38px; line-height: 1.15;
  color: var(--cream); background: transparent; border: none; outline: none;
  width: 100%; padding: 4px 0; letter-spacing: -.01em;
}
.page-title:empty:before { content: attr(data-placeholder); color: var(--cream-muted); }

/* ─── Blocks ─── */
.block-list { padding: 4px 0; }
.block {
  position: relative; padding: 2px 0 2px 32px; min-height: 28px;
  display: flex; align-items: flex-start; gap: 4px;
}
.block.drag-over-top { box-shadow: 0 -2px 0 0 var(--brass) inset; }
.block.drag-over-bot { box-shadow: 0 -2px 0 0 var(--brass); }
.block.is-dragging { opacity: .35; }
.block:hover .block-handle { opacity: .8; }
.block-handle {
  position: absolute; left: 0; top: 3px; opacity: 0; user-select: none;
  display: flex; gap: 1px; transition: opacity .14s;
}
.block-handle button {
  width: 18px; height: 22px; padding: 0; display: grid; place-items: center;
  color: var(--cream-muted); font-size: 13px; border-radius: 2px;
}
.block-handle button:hover { background: var(--ink); color: var(--brass); }
.block-handle .grip { cursor: grab; font-size: 14px; }
.block-handle .grip:active { cursor: grabbing; }
.block-content {
  flex: 1; outline: none; min-height: 24px; padding: 2px 0;
  font-size: 15px; line-height: 1.55; word-wrap: break-word;
}
.block-content:empty:before, .block-content.is-empty:before {
  content: attr(data-placeholder); color: var(--cream-muted); pointer-events: none;
}
.block[data-type="h1"] .block-content { font-family: var(--serif); font-size: 28px; font-weight: 700; line-height: 1.2; padding: 14px 0 6px; }
.block[data-type="h2"] .block-content { font-family: var(--serif); font-size: 22px; font-weight: 700; line-height: 1.25; padding: 10px 0 4px; }
.block[data-type="h3"] .block-content { font-family: var(--serif); font-size: 17px; font-weight: 700; line-height: 1.3; padding: 8px 0 4px; color: var(--cream); }
.block[data-type="bullet"] { padding-left: 54px; }
.block[data-type="bullet"]:before { content: "•"; position: absolute; left: 36px; top: 4px; color: var(--cream-dim); font-size: 16px; }
.block[data-type="numbered"] { padding-left: 54px; }
.block[data-type="numbered"]:before { content: attr(data-n) "."; position: absolute; left: 32px; top: 4px; color: var(--cream-dim); font-size: 13px; font-family: var(--mono); }
.block[data-type="todo"] { padding-left: 54px; }
.block[data-type="todo"] .todo-check {
  position: absolute; left: 34px; top: 6px; width: 16px; height: 16px;
  border: 1.5px solid var(--cream-muted); border-radius: 3px; cursor: pointer;
  display: grid; place-items: center; font-size: 11px; color: var(--void);
  background: var(--void); flex-shrink: 0;
}
.block[data-type="todo"][data-checked="true"] .todo-check { background: var(--brass); border-color: var(--brass); color: var(--void); }
.block[data-type="todo"][data-checked="true"] .block-content { color: var(--cream-muted); text-decoration: line-through; }
.block[data-type="quote"] { padding-left: 40px; }
.block[data-type="quote"]:before { content: ""; position: absolute; left: 32px; top: 6px; bottom: 6px; width: 3px; background: var(--brass); }
.block[data-type="quote"] .block-content { font-style: italic; color: var(--cream-dim); }
.block[data-type="callout"] .block-content {
  background: var(--ink); border-left: 3px solid var(--brass); border-radius: 3px;
  padding: 10px 14px; font-size: 14px;
}
.block[data-type="code"] .block-content {
  font-family: var(--mono); font-size: 12.5px; background: var(--ink);
  padding: 12px 14px; border-radius: 4px; border: 1px solid var(--line);
  white-space: pre-wrap; tab-size: 2;
}
.block[data-type="divider"] { padding: 12px 32px; min-height: auto; }
.block[data-type="divider"] .block-content { display: none; }
.block[data-type="divider"]:before { content: ""; display: block; height: 1px; background: var(--line); width: 100%; }
.block[data-type="link-to-page"] .block-content {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px;
  background: var(--ink); border-radius: 3px; cursor: pointer; color: var(--brass);
  border: 1px solid var(--line);
}
.block[data-type="link-to-page"] .block-content:hover { background: var(--ink-hover); border-color: var(--brass); }
.block[data-type="link-to-page"] .block-content:before { content: "↪"; font-family: var(--mono); }
.block[data-type="toggle"] { padding-left: 48px; }
.block[data-type="toggle"] .toggle-arrow {
  position: absolute; left: 30px; top: 6px; width: 18px; height: 18px;
  display: grid; place-items: center; font-size: 10px; color: var(--cream-dim); cursor: pointer;
  user-select: none; transition: transform .15s;
}
.block[data-type="toggle"][data-open="true"] .toggle-arrow { transform: rotate(90deg); }
.toggle-children {
  margin-left: 22px; padding-left: 4px; border-left: 1px solid var(--line-soft);
  margin-top: 2px;
}
.block[data-type="toggle"][data-open="false"] + .toggle-children { display: none; }
.block[data-type="image"] { padding-left: 32px; }
.block[data-type="image"] .block-content {
  padding: 0; max-width: 100%; overflow: hidden;
}
.block[data-type="image"] img { max-width: 100%; max-height: 600px; border-radius: 4px; display: block; }
.block[data-type="image"] .img-placeholder {
  border: 2px dashed var(--line); border-radius: 4px; padding: 40px;
  text-align: center; color: var(--cream-muted); cursor: pointer; background: var(--ink);
}
.block[data-type="image"] .img-placeholder:hover { border-color: var(--brass); color: var(--brass); }
.block strong { color: var(--brass); font-weight: 600; }
.block em { font-style: italic; }
.block code { font-family: var(--mono); background: rgba(255,255,255,.06); padding: 1px 5px; border-radius: 2px; font-size: 12.5px; color: var(--brass); }
.block s, .block del { color: var(--cream-muted); }
.block a { color: var(--brass); text-decoration: underline; text-underline-offset: 2px; }
.wiki-link { color: var(--brass); border-bottom: 1px dashed var(--brass); cursor: pointer; padding: 0 1px; }
.wiki-link.broken { color: var(--ox); border-color: var(--ox); }

/* ─── Database ─── */
.db-wrap { margin: 12px 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.db-toolbar {
  padding: 8px 12px; border-bottom: 1px solid var(--line);
  display: flex; gap: 8px; align-items: center; background: var(--void-2); flex-wrap: wrap;
}
.db-toolbar .view-tab {
  padding: 4px 10px; border: 1px solid var(--line); background: transparent; border-radius: 3px;
  font-size: 11px; color: var(--cream-dim); font-family: var(--mono); letter-spacing: .04em;
}
.db-toolbar .view-tab:hover { border-color: var(--brass); color: var(--brass); }
.db-toolbar .view-tab.active { background: var(--brass); color: var(--void); border-color: var(--brass); font-weight: 600; }
.db-toolbar button.tool-btn {
  padding: 4px 10px; border: 1px solid var(--line); background: var(--ink); border-radius: 3px;
  font-size: 11px; color: var(--cream-dim); font-family: var(--mono); letter-spacing: .04em;
}
.db-toolbar button.tool-btn:hover { border-color: var(--brass); color: var(--brass); }
.db-toolbar .count {
  font-family: var(--mono); font-size: 10px; color: var(--cream-muted);
  letter-spacing: .08em; text-transform: uppercase; margin-left: auto;
}
.db-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.db-table th {
  background: var(--void-2); padding: 7px 11px; text-align: left;
  border-bottom: 1px solid var(--line); border-right: 1px solid var(--line-soft);
  font-family: var(--mono); font-size: 10px; color: var(--cream-muted); letter-spacing: .08em;
  text-transform: uppercase; font-weight: 500; user-select: none; cursor: pointer;
  position: relative;
}
.db-table th:hover { background: var(--ink); color: var(--cream-dim); }
.db-table th .prop-type { color: var(--violet); font-size: 9px; margin-left: 4px; }
.db-table th .sort-mark { color: var(--brass); margin-left: 4px; font-family: var(--mono); }
.db-table th.add-prop { color: var(--cream-muted); cursor: pointer; }
.db-table th.add-prop:hover { color: var(--brass); }
.db-table td {
  padding: 6px 10px; border-bottom: 1px solid var(--line-soft); border-right: 1px solid var(--line-soft);
  vertical-align: top; cursor: text;
}
.db-table tr:hover td { background: rgba(255,255,255,.02); }
.db-table tr:hover td.row-handle { background: var(--ink); }
.db-table td.row-handle { width: 30px; text-align: center; color: var(--cream-muted); cursor: pointer; user-select: none; padding: 6px 4px; }
.db-table td.row-handle:hover { color: var(--brass); }
.db-table td.title-cell { color: var(--brass); font-weight: 500; cursor: pointer; }
.db-table td.title-cell:hover { text-decoration: underline; }
.db-table td .cell-edit {
  outline: none; min-height: 18px; padding: 0; background: transparent; border: none;
  width: 100%; color: var(--cream); font-size: 13px; font-family: inherit;
}
.db-table td .cell-edit:focus { background: rgba(184,151,74,.06); }
.db-table .add-row-row td { padding: 6px 10px; color: var(--cream-muted); cursor: pointer; }
.db-table .add-row-row:hover td { color: var(--brass); background: var(--ink); }
.tag {
  display: inline-block; padding: 1px 7px; border-radius: 8px; font-size: 11px;
  margin: 1px 2px 1px 0; background: var(--ink); border: 1px solid var(--line);
}
.tag[data-color="green"] { background: rgba(74,222,128,.16); color: var(--green); border-color: var(--green); }
.tag[data-color="amber"] { background: rgba(255,140,0,.16); color: var(--amber); border-color: var(--amber); }
.tag[data-color="red"] { background: rgba(239,68,68,.16); color: var(--red); border-color: var(--red); }
.tag[data-color="blue"] { background: rgba(96,165,250,.16); color: var(--blue); border-color: var(--blue); }
.tag[data-color="violet"] { background: rgba(168,85,247,.16); color: var(--violet); border-color: var(--violet); }
.tag[data-color="pink"] { background: rgba(236,72,153,.16); color: var(--pink); border-color: var(--pink); }
.tag[data-color="teal"] { background: rgba(20,184,166,.16); color: var(--teal); border-color: var(--teal); }
.checkbox-cell { font-size: 16px; color: var(--cream-muted); cursor: pointer; user-select: none; }
.checkbox-cell.checked { color: var(--brass); }

/* Board view */
.db-board {
  display: flex; gap: 12px; padding: 14px; overflow-x: auto; align-items: flex-start; min-height: 320px;
}
.board-col {
  flex: 0 0 280px; background: var(--void-2); border: 1px solid var(--line);
  border-radius: 4px; display: flex; flex-direction: column; max-height: 70vh;
}
.board-col .board-head {
  padding: 9px 12px; border-bottom: 1px solid var(--line-soft); display: flex;
  align-items: center; gap: 8px; user-select: none;
}
.board-col .board-head .ttl { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; color: var(--cream); }
.board-col .board-head .count { font-family: var(--mono); font-size: 10px; color: var(--cream-muted); }
.board-col .board-head .add { margin-left: auto; padding: 2px 8px; color: var(--cream-muted); font-size: 14px; cursor: pointer; border-radius: 2px; }
.board-col .board-head .add:hover { color: var(--brass); background: var(--ink); }
.board-col .board-list { padding: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 30px; }
.board-card {
  background: var(--ink); border: 1px solid var(--line); border-radius: 3px;
  padding: 8px 11px; cursor: pointer; transition: border-color .12s;
}
.board-card:hover { border-color: var(--brass); }
.board-card.is-dragging { opacity: .35; }
.board-card .bc-title { font-size: 13px; color: var(--cream); font-weight: 500; margin-bottom: 4px; }
.board-card .bc-meta { display: flex; flex-wrap: wrap; gap: 3px; font-size: 11px; }
.board-col.drag-over { background: rgba(184,151,74,.06); border-color: var(--brass); }

/* Calendar view */
.db-cal { padding: 12px; }
.cal-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; font-family: var(--mono); font-size: 12px; }
.cal-head button { padding: 4px 10px; border: 1px solid var(--line); background: var(--ink); border-radius: 3px; color: var(--cream-dim); }
.cal-head button:hover { border-color: var(--brass); color: var(--brass); }

      if (getKey('text', p)) { txt.textContent = 'T3 ' + (TEXT_PROVIDERS[p]?.label.split(' ')[0] || 'BYOK') + ' · active'; chip.classList.add('fk-chip-live'); }
      else { txt.textContent = 'T3 · no key set'; chip.classList.add('fk-chip-warn'); }
    }
  }

  async function loadWebLLM(modelKey) {
    if (STATE.ai.loading) return;
    const key = modelKey || STATE.config.webllm_model || DEFAULT_MODEL;
    const model = WEBLLM_MODELS[key];
    if (!model) { console.error('fall-kit: unknown model', key); return; }
    if (STATE.ai.ready && STATE.ai.model === model.id) return;
    STATE.ai.loading = true; STATE.ai.progress = 0; renderAiChip();
    notify('Loading WebLLM · ' + model.label + ' · ' + model.size + ' first time', 'info');
    try {
      const { CreateMLCEngine } = await import('https://esm.run/@mlc-ai/web-llm@0.2.79');
      const engine = await CreateMLCEngine(model.id, {
        initProgressCallback: p => { STATE.ai.progress = (p.progress || 0) * 100; renderAiChip(); }
      });
      STATE.ai.engine = engine; STATE.ai.model = model.id; STATE.ai.ready = true; STATE.ai.loading = false;
      STATE.config.webllm_model = key; saveConfig(); renderAiChip();
      notify('WebLLM ready · sovereign mode · ' + model.label.split(' · ')[0], 'ok');
    } catch (e) {
      console.error('fall-kit: WebLLM load failed', e);
      STATE.ai.loading = false; renderAiChip();
      notify('WebLLM load failed · ' + e.message, 'err');
    }
  }

  // ═══════════════════════ TEXT · aiComplete · aiChat ═══════════════
  // One way to ask every text provider: the system prompt first and the same each call (so a provider can reuse its
  // reading of it), then the conversation, which only ever grows. Pure pieces (requestOf, textOf, usageOf) are exposed
  // on FallKit for tests; nothing pure here touches the network.
  const isObj = (x) => x !== null && typeof x === 'object' && !Array.isArray(x);
  const count = (x) => (Number.isInteger(x) && x >= 0 ? x : 0);
  /** Claude models from 5.x think before they answer: room for that, and a light effort for an assistant's reply */
  const THINKS = (model) => /^claude-(?:opus|sonnet|haiku|fable|mythos)-5/.test(model);
  /** Claude models with a server-side fallback when a request is declined (Haiku has none) */
  const FALLS_BACK = (model) => /^claude-(?:opus|sonnet|fable)-5/.test(model);
  /** a message's words, whatever shape a provider keeps it in */
  function wordsOf(m) {
    if (!isObj(m)) return '';
    if (typeof m.content === 'string') return m.content;
    if (Array.isArray(m.content)) return m.content.filter((b) => isObj(b) && b.type === 'text' && typeof b.text === 'string').map((b) => b.text).join('\n');
    return '';
  }
  /**
   * The request a text provider is sent: { url, headers, body } for type (anthropic | openai | google | openai_compat |
   * cohere | hf_inference). messages: [{ role: 'user' | 'assistant', content }]. Pure: the key is placed, never kept.
   */
  function requestOf(type, opts) {
    const { model, key, system, messages, maxTokens, url } = opts;
    const max = Number.isInteger(maxTokens) && maxTokens > 0 ? maxTokens : 600;
    const plain = messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: wordsOf(m) }));
    if (type === 'anthropic') {
      const headers = { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
      const body = { model, max_tokens: THINKS(model) ? Math.max(max * 4, 4000) : max, system: [{ type: 'text', text: system, cache_control: { type: 'ephemeral' } }],
        messages: messages.map((m) => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content })) };
      if (THINKS(model)) body.output_config = { effort: 'low' };
      if (FALLS_BACK(model)) { headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; body.fallbacks = 'default'; }
      return { url: 'https://api.anthropic.com/v1/messages', headers, body };
    }
    if (type === 'openai') return { url: 'https://api.openai.com/v1/chat/completions', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_completion_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'google') return { url: 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', headers: { 'content-type': 'application/json', 'x-goog-api-key': key },
      body: { systemInstruction: { parts: [{ text: system }] }, contents: plain.map((m) => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })), generationConfig: { maxOutputTokens: max } } };
    if (type === 'cohere') return { url: 'https://api.cohere.com/v2/chat', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'hf_inference') return { url: 'https://api-inference.huggingface.co/models/' + model + '/v1/chat/completions', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    if (type === 'openai_compat') return { url: url, headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + key }, body: { model, max_tokens: max, messages: [{ role: 'system', content: system }].concat(plain) } };
    return null;
  }
  /** the answer's words from a provider's reply, or null when it declined or said nothing. Pure. */
  function textOf(type, j) {
    if (!isObj(j)) return null;
    let t = '';
    if (type === 'anthropic') { if (j.stop_reason === 'refusal' || !Array.isArray(j.content)) return null; t = wordsOf({ content: j.content }); }
    else if (type === 'google') { const c = Array.isArray(j.candidates) ? j.candidates[0] : null; t = c && isObj(c.content) && Array.isArray(c.content.parts) ? c.content.parts.map((p) => (isObj(p) && typeof p.text === 'string' ? p.text : '')).join('') : ''; }
    else if (type === 'cohere') { t = isObj(j.message) && Array.isArray(j.message.content) ? wordsOf({ content: j.message.content.map((b) => Object.assign({ type: 'text' }, b)) }) : ''; }
    else { const c = Array.isArray(j.choices) ? j.choices[0] : null; t = c && isObj(c.message) && typeof c.message.content === 'string' ? c.message.content : ''; }
    t = t.trim();
    return t ? t : null;
  }
  /** what a call used, read from a provider's own usage record: { read, recycled, written, out }. Pure. */
  function usageOf(type, j) {
    const u = isObj(j) ? (type === 'google' ? j.usageMetadata : type === 'cohere' && isObj(j.usage) ? j.usage.tokens : j.usage) : null;
    if (!isObj(u)) return { read: 0, recycled: 0, written: 0, out: 0 };
    if (type === 'anthropic') { const recycled = count(u.cache_read_input_tokens), written = count(u.cache_creation_input_tokens); return { read: count(u.input_tokens) + recycled + written, recycled, written, out: count(u.output_tokens) }; }
    if (type === 'google') { const read = count(u.promptTokenCount); return { read, recycled: Math.min(read, count(u.cachedContentTokenCount)), written: 0, out: count(u.candidatesTokenCount) + count(u.thoughtsTokenCount) }; }
    if (type === 'cohere') return { read: count(u.input_tokens), recycled: 0, written: 0, out: count(u.output_tokens) };
    const read = count(u.prompt_tokens), d = isObj(u.prompt_tokens_details) ? u.prompt_tokens_details : {};
    return { read, recycled: Math.min(read, count(d.cached_tokens)), written: 0, out: count(u.completion_tokens) };
  }

  async function aiComplete(systemPrompt, userMsg, maxTokens) {
    const r = await aiChat(systemPrompt, [], userMsg, maxTokens);
    return r ? r.text : null;
  }
  /**
   * One turn of a conversation: the system prompt, the history so far (unchanged), and the user's words. → { text,
   * assistant } — the caller appends { role: 'user', content: userMsg } and `assistant` to its history (assistant is the
   * reply as the provider gave it, so a provider that checks its own earlier turns sees them unchanged) — or null when no
   * tier can answer.
   */
  async function aiChat(systemPrompt, history, userMsg, maxTokens) {
    maxTokens = maxTokens || 600;
    const messages = (Array.isArray(history) ? history : []).concat([{ role: 'user', content: String(userMsg == null ? '' : userMsg) }]);
    const tier = aiTier();
    if (tier === 'T2' && STATE.ai.ready && STATE.ai.engine) {
      const r = await STATE.ai.engine.chat.completions.create({
        messages: [{ role: 'system', content: systemPrompt }].concat(messages.map((m) => ({ role: m.role, content: wordsOf(m) }))), max_tokens: maxTokens,
      });
      const text = r.choices[0].message.content;
      STATE.lastUsage = Object.assign({ provider: 'webllm' }, usageOf('openai', r));
      return { text: text, assistant: { role: 'assistant', content: text } };
    }
    if (tier === 'T3') {
      const p = activeTextProvider(); const key = getKey('text', p);
      if (!key) return null;
      return await textCall(p, systemPrompt, messages, maxTokens);
    }
    return null;
  }

  async function textCall(providerKey, sys, messages, maxTokens) {
    const p = TEXT_PROVIDERS[providerKey];
    const model = getModel('text', providerKey, TEXT_PROVIDERS);
    const req = requestOf(p.type, { model, key: getKey('text', providerKey), system: sys, messages, maxTokens, url: p.url });
    if (!req) throw new Error('unknown text provider type: ' + p.type);
    const r = await fetch(req.url, { method: 'POST', headers: req.headers, body: JSON.stringify(req.body) });
    if (!r.ok) throw new Error(p.label + ' ' + r.status);
    const j = await r.json();
    STATE.lastUsage = Object.assign({ provider: providerKey, model: model }, usageOf(p.type, j));
    const text = textOf(p.type, j);
    if (text === null) return null;
    return { text: text, assistant: p.type === 'anthropic' ? { role: 'assistant', content: j.content } : { role: 'assistant', content: text } };
  }

  // ═══════════════════════ ASK · about this page ═════════════════════
  // The kit's own use of the brain, so the chip is useful in any build, wired or not: a question about the page, answered
  // from the page's own words. The opening is read once per talk and sent byte-identical every question, so a provider
  // that caches recycles it; a talk starts afresh after MAX_ASKS questions or when the person starts again.
  const PAGE_MAX = 12000, MAX_ASKS = 20;
  const ASK_OPENING = 'You are the helper inside a web page. Answer questions about this page and how to use it, briefly and in plain words. Use only what the page says below; when it does not say, say so.';
  /** the opening for questions about a page: who the helper is, then the page's title, description and text. Pure. */
  function pageOpening(page) {
    const p = isObj(page) ? page : {};
    const line = (s, n) => (typeof s === 'string' ? s : '').replace(/\s+/g, ' ').trim().slice(0, n);
    const text = (typeof p.text === 'string' ? p.text : '').replace(/[ \t\r\f\v]+/g, ' ').replace(/ *\n[\s]*/g, '\n').trim().slice(0, PAGE_MAX);
    const about = line(p.description, 400);
    return ASK_OPENING + '\n\nPAGE: ' + (line(p.title, 200) || '(no title)') + '\n' + (about ? 'ABOUT: ' + about + '\n' : '') + 'TEXT:\n' + text;
  }
  function readPage() {   // the page as its reader has it, without the kit's own chip, panel and code
    const d = document.querySelector('meta[name="description"]');
    const body = document.body ? document.body.cloneNode(true) : null;
    if (body) {
      body.querySelectorAll('#fk-modal-bg, #fk-ai-chip, #fk-toast, script, style, noscript, template').forEach((e) => e.remove());
      body.querySelectorAll('td, th').forEach((e) => e.append(' | '));   // keep cells and blocks apart, as a reader sees them
      body.querySelectorAll('p, div, li, tr, h1, h2, h3, h4, h5, h6, br, pre, dt, dd, figcaption, blockquote, section, article, header, footer, nav, label, button, option').forEach((e) => e.append('\n'));
    }
    return { title: document.title, description: d ? d.getAttribute('content') : '', text: body ? body.textContent : '' };
  }
  async function askPage(question) {
    const q = String(question == null ? '' : question).trim();
    if (!q) return { text: null, why: 'Type a question first.' };
    if (aiTier() === 'T0') return { text: null, why: 'AI is off. Pick T2 (a model in your browser) or T3 (your own key) below, press Save, then ask.' };
    const t = STATE.ask;
    if (!t.opening || t.talk.length >= MAX_ASKS * 2) { t.opening = pageOpening(readPage()); t.talk = []; }
    const r = await aiChat(t.opening, t.talk, q, 600);
    if (!r) return { text: null, why: aiTier() === 'T2' ? 'The in-browser model is not loaded yet: press Load model below.' : 'No key is set for this provider: add one below and press Save.' };
    t.talk.push({ role: 'user', content: q }, r.assistant);
    t.last = r.text;
    return { text: r.text, why: null };
  }

  // ═══════════════════════ IMAGE · aiImage ═══════════════════════════
  async function aiImage(prompt, opts) {
    opts = opts || {};
    const providerKey = opts.provider || STATE.config.image_provider || 'fal';
    const p = IMAGE_PROVIDERS[providerKey];
    const key = getKey('image', providerKey);
    if (!key) return null;
    const model = opts.model || getModel('image', providerKey, IMAGE_PROVIDERS);

    if (p.type === 'fal') {
      const r = await fetch('https://fal.run/' + model, {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Key ' + key },
        body: JSON.stringify({ prompt, image_size: opts.size || 'landscape_4_3', num_inference_steps: opts.steps || 4 }),
      });
      if (!r.ok) throw new Error('fal ' + r.status);
      const j = await r.json();
      return { url: j.images?.[0]?.url || j.image?.url, raw: j };
    }
    if (p.type === 'hf_image') {
      const r = await fetch('https://api-inference.huggingface.co/models/' + model, {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ inputs: prompt }),
      });
      if (!r.ok) throw new Error('HF ' + r.status);
      const blob = await r.blob();
      return { url: URL.createObjectURL(blob), blob };
    }
    if (p.type === 'replicate') {
      const r = await fetch('https://api.replicate.com/v1/predictions', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Token ' + key, 'Prefer': 'wait' },
        body: JSON.stringify({ version: model, input: { prompt, num_outputs: 1 } }),
      });
      if (!r.ok) throw new Error('Replicate ' + r.status);
      const j = await r.json();
      return { url: Array.isArray(j.output) ? j.output[0] : j.output, raw: j };
    }
    if (p.type === 'openai_image') {
      const r = await fetch('https://api.openai.com/v1/images/generations', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model, prompt, n: 1, size: opts.size || '1024x1024' }),
      });
      if (!r.ok) throw new Error('OpenAI ' + r.status);
      const j = await r.json();
      return { url: j.data[0].url, raw: j };
    }
    if (p.type === 'openai_image_compat') {
      const r = await fetch(p.url, {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model, prompt, n: 1 }),
      });
      if (!r.ok) throw new Error(p.label + ' ' + r.status);
      const j = await r.json();
      return { url: j.data[0].url, raw: j };
    }
    if (p.type === 'google_image') {
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + model + ':predict?key=' + encodeURIComponent(key), {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ instances: [{ prompt }], parameters: { sampleCount: 1 } }),
      });
      if (!r.ok) throw new Error('Google Imagen ' + r.status);
      const j = await r.json();
      return { url: 'data:image/png;base64,' + j.predictions[0].bytesBase64Encoded, raw: j };
    }
    if (p.type === 'ideogram') {
      const r = await fetch('https://api.ideogram.ai/generate', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Api-Key': key },
        body: JSON.stringify({ image_request: { prompt, model, aspect_ratio: opts.size || 'ASPECT_16_9' } }),
      });
      if (!r.ok) throw new Error('Ideogram ' + r.status);
      const j = await r.json();
      return { url: j.data[0].url, raw: j };
    }
    if (p.type === 'leonardo') {
      const r = await fetch('https://cloud.leonardo.ai/api/rest/v1/generations', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ prompt, modelId: model, num_images: 1, width: 1024, height: 576 }),
      });
      if (!r.ok) throw new Error('Leonardo ' + r.status);
      const j = await r.json();
      return { id: j.sdGenerationJob.generationId, raw: j, note: 'poll /generations/:id for URL' };
    }
    throw new Error('unknown image provider type: ' + p.type);
  }

  // ═══════════════════════ STT · aiSTT ═══════════════════════════════
  async function aiSTT(blob, opts) {
    opts = opts || {};
    const providerKey = opts.provider || STATE.config.stt_provider || 'deepgram';
    const p = STT_PROVIDERS[providerKey];
    const key = getKey('stt', providerKey);
    if (!key) return null;
    const model = opts.model || getModel('stt', providerKey, STT_PROVIDERS);

    if (p.type === 'deepgram') {
      const r = await fetch('https://api.deepgram.com/v1/listen?model=' + model + '&smart_format=true', {
        method: 'POST', headers: { 'Authorization': 'Token ' + key, 'content-type': blob.type || 'audio/wav' },
        body: blob,
      });
      if (!r.ok) throw new Error('Deepgram ' + r.status);
      const j = await r.json();
      return { text: j.results?.channels?.[0]?.alternatives?.[0]?.transcript, raw: j };
    }
    if (p.type === 'assemblyai') {
      const up = await fetch('https://api.assemblyai.com/v2/upload', { method: 'POST', headers: { 'Authorization': key }, body: blob });
      const upJ = await up.json();
      const r = await fetch('https://api.assemblyai.com/v2/transcript', {
        method: 'POST', headers: { 'content-type': 'application/json', 'Authorization': key },
        body: JSON.stringify({ audio_url: upJ.upload_url, speech_model: model }),
      });
      if (!r.ok) throw new Error('AssemblyAI ' + r.status);
      const j = await r.json();
      return { id: j.id, raw: j, note: 'poll for text' };
    }
    if (p.type === 'openai_stt') {
      const fd = new FormData();
      fd.append('file', blob, 'audio.wav');
      fd.append('model', model);
      const r = await fetch('https://api.openai.com/v1/audio/transcriptions', {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + key }, body: fd,
      });
      if (!r.ok) throw new Error('OpenAI Whisper ' + r.status);
      const j = await r.json();
      return { text: j.text, raw: j };
    }
    throw new Error('unknown STT provider type: ' + p.type);
  }

  // ─── WebRTC P2P mesh ────────────────────────────────────────────────
  const MESH_CHANNEL = 'fall-signal';
  function meshStart(opts) {
    if (STATE.mesh.active) return;
    opts = opts || {};
    const seedId = opts.seedId || (location.pathname + '#' + Math.random().toString(36).slice(2, 8));
    STATE.mesh.seedId = seedId;
    try { STATE.mesh.bc = new BroadcastChannel(MESH_CHANNEL); }
    catch (e) { console.warn('fall-kit: BroadcastChannel unavailable'); return; }
    STATE.mesh.bc.onmessage = e => {
      const m = e.data;
      if (!m || !m.kind || m.peerId === seedId) return;
      if (opts.onMessage) opts.onMessage(m);
    };
    STATE.mesh.bc.postMessage({ kind: 'fall-kit:hello', peerId: seedId, ts: Date.now(), seedName: opts.seedName || 'unknown' });
    STATE.mesh.active = true;
    notify('Mesh active · channel ' + MESH_CHANNEL, 'ok');
  }
  function meshPost(kind, payload) {
    if (!STATE.mesh.active || !STATE.mesh.bc) return false;
    STATE.mesh.bc.postMessage({ kind: kind, peerId: STATE.mesh.seedId, ts: Date.now(), payload: payload });
    return true;
  }

      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.background = kind === 'err' ? '#a14a2a' : kind === 'ok' ? '#6b8d4a' : '#c08a3a';
    t.style.color = kind === 'err' ? '#fff' : '#0a0a0a';
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(t._to);
    t._to = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)'; }, 2400);
  }

  // ─── The floating chip keeps clear of the build's own fixed bars and controls ─────────
  // A build's bottom tab bar or floating button stays put while the page scrolls, so a chip over it would hide it. The
  // chip looks at what is under it and moves up past it; a fixed container as tall as the page counts only by the
  // control under the chip. Content that scrolls is not in the way.
  function blockerUnder(el) {
    let fixed = null;
    for (let e = el; e && e !== document.body && e !== document.documentElement; e = e.parentElement) {
      const pos = getComputedStyle(e).position;
      if (pos === 'fixed' || pos === 'sticky') { fixed = e; break; }
    }
    if (!fixed) return null;
    if (fixed.getBoundingClientRect().height <= innerHeight * 0.4) return fixed;
    return el.closest('button, a, input, select, textarea, label, [role=button], [tabindex]');
  }
  function placeChip(chip) {
    if (!chip || chip.dataset.anchored) return;
    chip.style.top = ''; chip.style.bottom = '14px';
    for (let i = 0; i < 6; i++) {
      const r = chip.getBoundingClientRect();
      chip.style.visibility = 'hidden';
      const hit = [[r.left + 2, r.top + 2], [r.right - 2, r.top + 2], [r.left + 2, r.bottom - 2], [r.right - 2, r.bottom - 2]]
        .map(([x, y]) => document.elementFromPoint(x, y)).filter(Boolean).map(blockerUnder).find(Boolean);
      chip.style.visibility = '';
      if (!hit) return;
      const bottom = innerHeight - hit.getBoundingClientRect().top + 8;
      if (bottom > innerHeight * 0.6) { chip.style.bottom = ''; chip.style.top = '14px'; return; }
      chip.style.bottom = bottom + 'px';

  // ─── Init ───────────────────────────────────────────────────────────
  function init(opts) {
